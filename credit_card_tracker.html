<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Credit Card Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#1f3864; --navy-light:#2e4a7d; --navy-dark:#152647;
    --bg:#f4f6fb; --card-bg:#ffffff; --border:#e5e8f0;
    --text:#1a1d29; --text-muted:#6b7280; --text-soft:#94a0b4;
    --green:#16a34a; --green-bg:#e7f7ed;
    --amber:#d97706; --amber-bg:#fef3c7;
    --red:#dc2626; --red-bg:#fde8e8;
    --gray:#6b7280; --gray-bg:#eef0f4;
    --accent:#b8902f; --accent-bg:#faf3e2;
    --radius:14px; --radius-sm:8px;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --shadow-md:0 4px 12px rgba(16,24,40,.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);}
  a{color:inherit;}
  .app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{width:240px;background:linear-gradient(180deg,var(--navy) 0%,var(--navy-dark) 100%);color:#fff;
    display:flex;flex-direction:column;padding:22px 14px;position:fixed;top:0;bottom:0;left:0;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px 10px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:16px;}
  .brand .logo{font-size:22px;}
  .brand .title{font-size:15px;font-weight:700;line-height:1.25;}
  .brand .sub{font-size:11px;color:rgba(255,255,255,.55);font-weight:400;}
  .nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav button{display:flex;align-items:center;gap:10px;background:none;border:none;color:rgba(255,255,255,.75);
    padding:10px 12px;border-radius:10px;font-size:14px;cursor:pointer;text-align:left;transition:.15s;font-family:inherit;}
  .nav button:hover{background:rgba(255,255,255,.08);color:#fff;}
  .nav button.active{background:rgba(255,255,255,.14);color:#fff;font-weight:600;}
  .nav .icon{width:18px;text-align:center;}
  .sidebar-foot{font-size:11px;color:rgba(255,255,255,.4);padding:10px;line-height:1.5;}

  /* ---------- Main ---------- */
  .main{margin-left:240px;flex:1;padding:26px 32px 60px 32px;max-width:1280px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
  .topbar h1{font-size:22px;margin:0 0 4px 0;}
  .topbar p.desc{margin:0;color:var(--text-muted);font-size:13.5px;max-width:640px;}
  .topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .sync-status{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap;}
  .sync-status:empty{display:none;}
  .sync-syncing{color:var(--amber);background:rgba(217,164,65,.12);}
  .sync-synced{color:var(--green);background:rgba(76,175,110,.12);}
  .sync-offline{color:var(--red);background:rgba(217,83,79,.12);}

  select, input, textarea{font-family:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--border);
    border-radius:8px;background:#fff;color:var(--text);}
  select:focus, input:focus, textarea:focus{outline:2px solid var(--navy-light);outline-offset:-1px;}

  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;color:var(--text);
    padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit;}
  .btn:hover{background:var(--gray-bg);}
  .btn-primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  .btn-primary:hover{background:var(--navy-light);}
  .btn-danger{color:var(--red);}
  .btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px;}
  .btn-ghost{border:none;background:none;}

  /* ---------- KPI cards ---------- */
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
  .kpi{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
  .kpi .label{font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .kpi .value{font-size:24px;font-weight:700;margin-top:6px;}
  .kpi .value.pos{color:var(--green);}
  .kpi .value.neg{color:var(--red);}

  /* ---------- Cards / lists ---------- */
  .panel{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
  .panel-head h2{font-size:15px;margin:0;}
  .panel-body{padding:6px 0;}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:16px;}
  .card-tile{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;background:#fbfcfe;transition:.15s;}
  .card-tile:hover{box-shadow:var(--shadow-md);border-color:#d3dae6;}
  .card-tile .name{font-weight:700;font-size:14px;margin-bottom:2px;}
  .card-tile .meta{font-size:12px;color:var(--text-muted);margin-bottom:10px;}
  .card-tile .row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
  .card-tile .row .l{color:var(--text-muted);}
  .card-tile .row .r{font-weight:600;}
  .card-tile .actions{margin-top:10px;display:flex;gap:6px;}

  .list-row{display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid var(--border);}
  .list-row:last-child{border-bottom:none;}
  .list-row:hover{background:#fafbfd;}
  .list-row .main-col{flex:1;min-width:0;}

  /* ---------- Drag-to-reorder handle (pointer-events based: mouse + touch + keyboard) ---------- */
  .drag-handle{cursor:grab;color:var(--text-soft);font-size:16px;line-height:1;width:20px;text-align:center;
    touch-action:none;user-select:none;border-radius:6px;padding:4px 0;}
  .drag-handle:hover{color:var(--text-muted);background:var(--gray-bg);}
  .drag-handle:focus-visible{outline:2px solid var(--navy-light);outline-offset:1px;}
  .list-row.dragging, tr.dragging{opacity:.45;background:var(--gray-bg) !important;}
  .list-row.drag-active .drag-handle{cursor:grabbing;}
  .list-row .title{font-weight:600;font-size:13.5px;}
  .list-row .subtitle{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .list-row .amount{font-weight:700;font-size:14px;width:80px;text-align:right;}
  .list-row .days{width:120px;font-size:12.5px;color:var(--text-muted);text-align:right;}
  .list-row .actions{display:flex;gap:6px;}

  .pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .pill-green{background:var(--green-bg);color:var(--green);}
  .pill-amber{background:var(--amber-bg);color:var(--amber);}
  .pill-red{background:var(--red-bg);color:var(--red);}
  .pill-gray{background:var(--gray-bg);color:var(--gray);}
  .pill-accent{background:var(--accent-bg);color:var(--accent);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);
     padding:10px 20px;border-bottom:1px solid var(--border);background:#fafbfd;}
  td{padding:11px 20px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#fafbfd;}

  .empty{padding:30px;text-align:center;color:var(--text-soft);font-size:13.5px;}

  .chart-wrap{padding:18px 20px;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,20,35,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:var(--radius);width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .modal-head h3{margin:0;font-size:16px;}
  .modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12.5px;font-weight:600;color:var(--text-muted);}
  .field input, .field select, .field textarea{width:100%;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
  .close-x{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-muted);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .hint{font-size:11.5px;color:var(--text-soft);}

  .toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;
    font-size:13.5px;box-shadow:var(--shadow-md);z-index:200;display:none;}
  .toast.show{display:block;animation:fadein .2s;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  @media (max-width:900px){
    .sidebar{position:relative;width:100%;height:auto;flex-direction:row;overflow-x:auto;padding:12px;}
    .brand{display:none;}
    .nav{flex-direction:row;}
    .main{margin-left:0;padding:18px;}
  }
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="brand">
      <div class="logo">🏨</div>
      <div>
        <div class="title">Hotel Card Tracker</div>
        <div class="sub">Credits &amp; free nights</div>
      </div>
    </div>
    <div class="nav" id="nav">
      <button data-view="dashboard" class="active"><span class="icon">📊</span> Dashboard</button>
      <button data-view="cards"><span class="icon">💳</span> Cards</button>
      <button data-view="credits"><span class="icon">🔁</span> Annual Credits</button>
      <button data-view="freenights"><span class="icon">🌙</span> Free Nights</button>
      <button data-view="history"><span class="icon">📜</span> Redemption Log</button>
    </div>
    <div class="sidebar-foot">
      Synced automatically across your devices.<br>Export is still a good idea as a backup.
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p class="desc" id="pageDesc">Annual fee vs. value realized, by card.</p>
      </div>
      <div class="topbar-actions">
        <span id="syncStatus" class="sync-status"></span>
        <select id="yearSelect"></select>
        <button class="btn btn-sm" id="addYearBtn" title="Add a future year to the dropdown">+ Add year</button>
        <button class="btn" id="exportBtn">⬇ Export</button>
        <button class="btn" id="importBtn">⬆ Import</button>
        <input type="file" id="importFile" accept="application/json" style="display:none;">
      </div>
    </div>

    <div id="content"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   SEED DATA — carried over from the user's existing spreadsheet
   ============================================================ */
const SEED = {
  cards: [
    {id:'c1', name:'Ritz-Carlton Credit Card', issuer:'Chase', fee:450, program:'Marriott Bonvoy', eliteStatus:true, notes:'Automatic Bonvoy Gold Elite + 15 Elite Night Credits/yr'},
    {id:'c2', name:'Amex Marriott Bonvoy (Personal) …22002', issuer:'American Express', fee:95, program:'Marriott Bonvoy', eliteStatus:true, notes:'Card 1 of 2 personal Bonvoy cards'},
    {id:'c3', name:'Amex Marriott Bonvoy (Personal) …13002', issuer:'American Express', fee:95, program:'Marriott Bonvoy', eliteStatus:true, notes:'Card 2 of 2 personal Bonvoy cards'},
    {id:'c4', name:'Amex Marriott Bonvoy Business', issuer:'American Express', fee:125, program:'Marriott Bonvoy', eliteStatus:true, notes:'Automatic Bonvoy Gold Elite'},
    {id:'c5', name:'Hilton Aspire Card', issuer:'American Express', fee:550, program:'Hilton Honors', eliteStatus:true, notes:'Complimentary Hilton Honors Diamond status'},
    {id:'c6', name:'Chase IHG One Rewards Premier', issuer:'Chase', fee:99, program:'IHG One Rewards', eliteStatus:true, notes:'Automatic IHG Platinum Elite (Diamond after $40K spend)'},
    {id:'c7', name:'Chase Sapphire Preferred', issuer:'Chase', fee:95, program:'Chase Ultimate Rewards (transferable)', eliteStatus:false, notes:'General travel card, no hotel elite status'},
    {id:'c8', name:'Citi Strata Premier', issuer:'Citi', fee:95, program:'Citi ThankYou Points (transferable)', eliteStatus:false, notes:'General travel card, no hotel elite status'},
    {id:'c9', name:'Capital One Venture X', issuer:'Capital One', fee:395, program:'Capital One Miles (transferable)', eliteStatus:false, notes:'Priority Pass + Capital One Lounge access'},
  ],
  credits: [
    {id:'cr1', cardId:'c1', name:'$300 Annual Travel/Airline Incidental Credit', value:300, frequency:'Annual', anchor:'2026-01-01'},
    {id:'cr2', cardId:'c1', name:'$100 Ritz-Carlton/St. Regis Property Credit (2+ night paid stay)', value:100, frequency:'Per Stay', anchor:'2026-07-01'},
    {id:'cr3', cardId:'c6', name:'$50 United TravelBank Cash Credit', value:50, frequency:'Annual', anchor:'2026-01-01'},
    {id:'cr4', cardId:'c5', name:'$200 Hilton Resort Credit - H1 (Jan-Jun)', value:200, frequency:'Semi-Annual', anchor:'2026-01-01'},
    {id:'cr5', cardId:'c5', name:'$200 Hilton Resort Credit - H2 (Jul-Dec)', value:200, frequency:'Semi-Annual', anchor:'2026-07-01'},
    {id:'cr6', cardId:'c5', name:'$50 Flight Credit - Q1', value:50, frequency:'Quarterly', anchor:'2026-01-01'},
    {id:'cr7', cardId:'c5', name:'$50 Flight Credit - Q2', value:50, frequency:'Quarterly', anchor:'2026-04-01'},
    {id:'cr8', cardId:'c5', name:'$50 Flight Credit - Q3', value:50, frequency:'Quarterly', anchor:'2026-07-01'},
    {id:'cr9', cardId:'c5', name:'$50 Flight Credit - Q4', value:50, frequency:'Quarterly', anchor:'2026-10-01'},
    {id:'cr10', cardId:'c5', name:'$100 Waldorf Astoria/Conrad Property Credit (2-night min stay)', value:100, frequency:'Annual', anchor:'2025-11-07'},
    {id:'cr11', cardId:'c7', name:'$100 Hotel Credit via Chase Travel', value:100, frequency:'Annual', anchor:'2025-08-25'},
    {id:'cr12', cardId:'c8', name:'$100 Annual Hotel Benefit (single stay $500+ via Citi Travel)', value:100, frequency:'Annual', anchor:'2026-01-01'},
    {id:'cr13', cardId:'c9', name:'$300 Annual Travel Credit (Capital One Travel)', value:300, frequency:'Annual', anchor:'2025-12-24'},
    {id:'cr14', cardId:'c9', name:'10,000 Anniversary Bonus Miles (~$100 value, auto-applied)', value:100, frequency:'Annual', anchor:'2025-12-31', autoRedeem:true},
  ],
  freeNights: [
    {id:'fn1', cardId:'c1', program:'Marriott Bonvoy', desc:'Anniversary Free Night Award - up to 85,000 pts (can top off +25,000 pts)', anchor:'2026-02-07', cashValue:null},
    {id:'fn2', cardId:'c2', program:'Marriott Bonvoy', desc:'Renewal Free Night Award - up to 35,000 pts', anchor:'2025-09-07', cashValue:null},
    {id:'fn3', cardId:'c3', program:'Marriott Bonvoy', desc:'Renewal Free Night Award - up to 35,000 pts', anchor:null, cashValue:null},
    {id:'fn4', cardId:'c4', program:'Marriott Bonvoy', desc:'Renewal Free Night Award - up to 35,000 pts', anchor:'2025-11-08', cashValue:null},
    {id:'fn5', cardId:'c5', program:'Hilton Honors', desc:'Annual/Renewal Free Night Reward - any standard room, no point cap', anchor:'2026-01-01', cashValue:678, property:'Waldorf Osaka'},
    {id:'fn6', cardId:'c6', program:'IHG One Rewards', desc:'Anniversary Free Night - up to 40,000 pts (can top off with own points)', anchor:'2025-08-01', cashValue:224, property:null},
  ],
  history: [
    {id:'rh1', date:'2026-02-19', cardId:'c1', type:'Credit', sourceId:'cr1', desc:'$300 Annual Travel/Airline Incidental Credit', amount:300},
    {id:'rh3', date:'2026-12-25', cardId:'c9', type:'Credit', sourceId:'cr13', desc:'$300 Annual Travel Credit (Capital One Travel)', amount:300},
  ],
  trackedYears: [2027, 2028, 2029],
  _version: 5,
};

/* ============================================================
   STATE — load from localStorage, or fall back to seed data
   ============================================================ */
const STORE_KEY = 'hotelCardTrackerData_v1';
const SYNCED_AT_KEY = STORE_KEY + '_syncedAt';
const CURRENT_DATA_VERSION = 5;
let DATA = loadLocalData();

// Local-only load — instant, works offline, used for first paint on every
// page open. Cloud sync (below) reconciles with this right after.
function loadLocalData(){
  let data;
  try{
    const raw = localStorage.getItem(STORE_KEY);
    data = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(SEED));
  }catch(e){
    console.warn('Could not read saved data, using seed.', e);
    data = JSON.parse(JSON.stringify(SEED));
  }
  data = migrateData(data);
  return data;
}

// One-time migrations applied to data saved by older versions of this file.
function migrateData(data){
  if(!data._version || data._version < 2){
    // v2: dropped 2025 redemption history entries permanently, and introduced
    // an explicit "tracked years" list so future years can be added on demand.
    data.history = (data.history||[]).filter(h => parseDate(h.date).getFullYear() !== 2025);
    const existing = new Set(data.trackedYears || []);
    [2027, 2028, 2029].forEach(y => existing.add(y));
    data.trackedYears = Array.from(existing).sort((a,b)=>a-b);
    data._version = 2;
  }
  if(data._version < 3){
    // v3 (superseded by v4 below): had briefly merged the four "$50 Flight
    // Credit - Q1..Q4" rows and the two "$200 Hilton Resort Credit - H1/H2"
    // rows into one calendar-aligned credit each, to stop them from
    // converging onto the same displayed date. Left as a no-op passthrough
    // since v4 replaces this approach entirely — kept only so `_version`
    // still advances correctly for anyone who saved data before v4 shipped.
    data._version = 3;
  }
  if(data._version < 4){
    // v4: restores four separate Q1-Q4 rows and two separate H1/H2 rows
    // (each is tracked as its own distinct benefit, as requested) and fixes
    // the actual bug a different way — see the comment on currentCycle().
    // In short: each row now rolls forward a full 12 months to reach its
    // *next own occurrence* instead of rolling forward by its stated
    // frequency (3 or 6 months), which was what made separate rows drift
    // into each other's windows over time.
    const cr4 = data.credits.find(cr=>cr.id==='cr4');
    if(cr4){
      delete cr4.calendarAligned;
      if(cr4.name === '$200 Hilton Resort Credit (Semi-Annual: Jan-Jun / Jul-Dec)') cr4.name = '$200 Hilton Resort Credit - H1 (Jan-Jun)';
    }
    if(!data.credits.find(cr=>cr.id==='cr5')){
      data.credits.push({id:'cr5', cardId:'c5', name:'$200 Hilton Resort Credit - H2 (Jul-Dec)', value:200, frequency:'Semi-Annual', anchor:'2026-07-01'});
    }
    const cr6 = data.credits.find(cr=>cr.id==='cr6');
    if(cr6){
      delete cr6.calendarAligned;
      if(cr6.name === '$50 Hilton Flight Credit (Quarterly: Jan-Mar / Apr-Jun / Jul-Sep / Oct-Dec)') cr6.name = '$50 Flight Credit - Q1';
    }
    ['cr7','cr8','cr9'].forEach((id,i)=>{
      if(!data.credits.find(cr=>cr.id===id)){
        const month = String((i+1)*3 + 1).padStart(2,'0');
        data.credits.push({id, cardId:'c5', name:`$50 Flight Credit - Q${i+2}`, value:50, frequency:'Quarterly', anchor:`2026-${month}-01`});
      }
    });
    (data.credits||[]).forEach(cr=>delete cr.calendarAligned);
    data._version = 4;
  }
  if(data._version < 5){
    // v5: the Capital One Venture X 10,000 Anniversary Bonus Miles credit is
    // auto-applied by Capital One every year (no spending/booking needed to
    // "redeem" it) — flag it so the app logs it automatically instead of
    // waiting for a manual "Mark redeemed" click, and align its anchor to
    // Dec 31 (the actual date it posts) so the auto-check fires on schedule.
    const cr14 = data.credits.find(cr=>cr.id==='cr14');
    if(cr14){
      if(cr14.anchor === '2025-12-24') cr14.anchor = '2025-12-31';
      cr14.autoRedeem = true;
    }
    data._version = 5;
  }
  return data;
}
function saveData(){
  localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
  syncPending = true;
  pushToCloud();
}
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

/* ============================================================
   CLOUD SYNC (Supabase)
   Local storage stays the instant, offline-safe cache used for
   first paint. Supabase holds one shared row (id='main') that
   every device reads from and writes to, so edits made on one
   device show up on the others. This is "last write wins" — the
   two most recent writes don't get merged field-by-field — which
   is fine as long as you're not editing the same data on two
   devices at the exact same moment.
   ============================================================ */
const SUPABASE_URL = 'https://kavlfymmtjyumaacejaz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthdmxmeW1tdGp5dW1hYWNlamF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMDE0NjIsImV4cCI6MjA5OTc3NzQ2Mn0.U3aydQ0ZEyj_O9mKcpDAPc8O9137pzffVer7bnGCvIY';

let supabaseClient = null;
try{
  if(typeof window !== 'undefined' && window.supabase && window.supabase.createClient){
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
}catch(e){
  console.warn('Supabase client failed to initialize — running in local-only mode.', e);
}

let syncPending = false; // true if we have local changes not yet confirmed saved to the cloud

function setSyncStatus(state){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  const label = {syncing:'Syncing…', synced:'Synced', offline:'Offline — saved locally'}[state] || '';
  el.textContent = label;
  el.className = 'sync-status sync-' + state;
}

// Fetch the shared row from Supabase. Returns {data, updated_at} or null
// (null covers: no client configured, no row saved yet, or a network error).
async function pullFromCloud(){
  if(!supabaseClient) return null;
  try{
    const { data, error } = await supabaseClient
      .from('tracker_data')
      .select('data, updated_at')
      .eq('id', 'main')
      .maybeSingle();
    if(error) throw error;
    return data || null;
  }catch(e){
    console.warn('Cloud pull failed', e);
    return null;
  }
}

// Push the current in-memory DATA up to Supabase.
async function pushToCloud(){
  if(!supabaseClient) return;
  setSyncStatus('syncing');
  const nowIso = new Date().toISOString();
  try{
    const { error } = await supabaseClient
      .from('tracker_data')
      .upsert({ id: 'main', data: DATA, updated_at: nowIso });
    if(error) throw error;
    localStorage.setItem(SYNCED_AT_KEY, nowIso);
    syncPending = false;
    setSyncStatus('synced');
  }catch(e){
    console.warn('Cloud push failed — will retry next time this tab becomes active or reloads.', e);
    syncPending = true;
    setSyncStatus('offline');
  }
}

// Reconcile local data with the cloud. Safe to call anytime: it only
// overwrites local DATA if the cloud copy is confirmed newer than the last
// version this device synced (so it never clobbers your own unsaved edits).
async function bootstrapSync(){
  const remote = await pullFromCloud();
  if(!remote){
    // Either offline, or nothing has been saved to the cloud yet — seed it
    // with what we already have so other devices have something to pull.
    if(supabaseClient) await pushToCloud();
    return;
  }
  const lastSyncedAt = localStorage.getItem(SYNCED_AT_KEY);
  if(lastSyncedAt && remote.updated_at && new Date(remote.updated_at) <= new Date(lastSyncedAt)){
    // Cloud hasn't changed since we last synced from this device — nothing to pull.
    setSyncStatus('synced');
    return;
  }
  DATA = migrateData(remote.data);
  localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
  localStorage.setItem(SYNCED_AT_KEY, remote.updated_at);
  runAutoRedemptions();
  renderYearSelect();
  switchView(currentView);
  setSyncStatus('synced');
}

/* ============================================================
   DATE / CYCLE HELPERS
   ============================================================ */
const MS_DAY = 86400000;
function parseDate(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDate(d){ if(!d) return '—'; return d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); }
function addMonths(date, months){ const d = new Date(date); d.setMonth(d.getMonth()+months); return d; }
function daysBetween(a,b){ return Math.round((b-a)/MS_DAY); }

const CYCLE_MONTHS = {'Annual':12, 'Semi-Annual':6, 'Quarterly':3, 'Per Stay':12};

// Find the currently-active (or next upcoming) window for a recurring
// credit: a window of `durationMonths` starting at `anchorStr`, which
// recurs every `rollMonths` months.
//
// These two numbers are deliberately kept separate. A card can offer, say,
// four *distinct* $50 quarterly credits (Q1, Q2, Q3, Q4), each tracked as
// its own row so they can be seen and reordered independently. Each of
// those rows is a 3-month-long window (durationMonths=3, matching
// "Quarterly"), but the row itself only comes back around once a year
// (rollMonths=12) — Q1 stays Q1 forever, it never rolls forward into Q2's
// slot. Using the same number for both (the original bug) made every
// row's window walk forward through the *other* rows' slots every cycle,
// so after enough time passed all four rows converged onto the same
// displayed dates and looked like duplicates.
//
// Only forward-rolling is needed: an anchor dated later than today simply
// means this row's window hasn't started yet, which is already a valid,
// correct "upcoming" result — nothing needs to be rolled backward to reach
// it.
function currentCycle(anchorStr, durationMonths, rollMonths, today){
  const anchor = parseDate(anchorStr);
  if(!anchor) return null;
  let start = anchor, end = addMonths(anchor, durationMonths), nextStart = addMonths(anchor, rollMonths);
  // Roll forward while the *next* occurrence has already begun — not just
  // while this slot's own narrow window has ended. For a quarterly credit,
  // durationMonths (3) is shorter than rollMonths (12), so the window is
  // "over" on paper for 9 months before the row comes back around. Rolling
  // on end<=today jumped straight to next year's slot the moment the
  // quarter closed, even if you hadn't redeemed it yet — so a redemption
  // logged any time after the quarter ended no longer fell inside the
  // (now future) window and never showed as Redeemed. This row should stay
  // "current" — available to mark redeemed, even if overdue — for the
  // whole rollMonths period, only actually advancing once the *next*
  // occurrence's start date arrives.
  while(nextStart <= today){
    start = nextStart;
    end = addMonths(start, durationMonths);
    nextStart = addMonths(start, rollMonths);
  }
  return {start, end, nextStart};
}

function statusForDays(daysRemaining, planSoonThreshold){
  if(daysRemaining <= 30) return {label:'Urgent', cls:'pill-red'};
  if(daysRemaining <= planSoonThreshold) return {label:'Plan soon', cls:'pill-amber'};
  return {label:'OK', cls:'pill-green'};
}

// A free night certificate's real-world expiration doesn't always match the
// calculated 12-months-from-anchor date exactly (issuers can run a few days
// behind, or grant a one-time extension). `expirationOverride`, if set on
// the certificate, takes precedence over the calculated cycle end for every
// display/sort/status purpose. Falls back to the calculated date otherwise.
function effectiveExpiration(fn, cycle){
  if(fn.expirationOverride){
    const d = parseDate(fn.expirationOverride);
    if(d) return d;
  }
  return cycle ? cycle.end : null;
}

/* Redemption-history entries logged against a given source item that fall
   within the given cycle window (mirrors the SUMIFS logic from the
   spreadsheet, but returns the actual entries so they can be edited or
   un-redeemed, not just summed). */
function historyEntriesInCycle(sourceId, cycle){
  if(!cycle) return [];
  // Match against the full "ownership window" for this slot (start up to
  // the next occurrence's start), not just the narrower nominal end date —
  // see the comment on currentCycle(). This lets a redemption logged after
  // a quarterly/semi-annual credit's own window has closed (but before the
  // next year's occurrence begins) still count toward this row.
  return DATA.history
    .filter(h => h.sourceId === sourceId)
    .filter(h => { const d = parseDate(h.date); return d >= cycle.start && d < cycle.nextStart; });
}
function redeemedInCycle(sourceId, cycle){
  return historyEntriesInCycle(sourceId, cycle).reduce((sum,h) => sum + Number(h.amount||0), 0);
}

// Format a local-time Date back to a 'YYYY-MM-DD' string for storing in a
// history entry. Deliberately not toISOString().slice(0,10) — that converts
// to UTC first, which silently shifts the date back a day for anyone east
// of UTC (most of Asia/Australia) when the local time is midnight.
function toISODate(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// Some benefits (like a card's anniversary bonus) are credited automatically
// by the issuer — there's nothing to spend or book, so requiring a manual
// "Mark redeemed" click doesn't fit. A credit flagged `autoRedeem: true`
// gets its redemption logged by the app itself, the moment its cycle's
// start date (the day it actually posts) arrives, if nothing's been logged
// for that cycle yet. Safe to call anytime — it only ever adds an entry
// once per cycle, same as the manual duplicate-block guard elsewhere.
function runAutoRedemptions(){
  const today = new Date();
  let changed = false;
  DATA.credits.forEach(cr=>{
    if(!cr.autoRedeem) return;
    const cycle = currentCycle(cr.anchor, CYCLE_MONTHS[cr.frequency]||12, 12, today);
    if(!cycle || today < cycle.start) return;
    if(historyEntriesInCycle(cr.id, cycle).length > 0) return;
    DATA.history.push({
      id: uid('rh'), date: toISODate(cycle.start), cardId: cr.cardId, type:'Credit',
      sourceId: cr.id, desc: cr.name, amount: cr.value
    });
    changed = true;
  });
  if(changed) saveData();
  return changed;
}

// Delete every history entry backing a redeemed credit/free-night for its
// current cycle, reverting it to "not redeemed" — the inverse of "Mark
// redeemed" / "Mark used".
function unredeemItem(kind, sourceId, cycle){
  const entries = historyEntriesInCycle(sourceId, cycle);
  if(entries.length === 0) return;
  const label = kind==='cr' ? 'credit' : 'free night';
  const msg = entries.length === 1
    ? `Remove this logged redemption? This ${label} will show as not redeemed again.`
    : `Remove all ${entries.length} logged redemptions for this period? This ${label} will show as not redeemed again.`;
  if(!confirm(msg)) return;
  const idsToRemove = new Set(entries.map(e=>e.id));
  DATA.history = DATA.history.filter(h=>!idsToRemove.has(h.id));
  saveData();
  views[currentView].render();
  toast('Redemption removed');
}

function allYears(){

let fnSortMode = 'daysLeft';      // 'daysLeft' | 'value' | 'manual'

/* ============================================================
   DRAG-TO-REORDER — one shared, generic implementation used by the
   Annual Credits, Free Nights, and Redemption Log lists.

   Built on Pointer Events (not the native HTML5 drag-and-drop API):
   native drag-and-drop simply does not fire on touch screens in any
   mobile browser, which would silently break reordering on phones —
   Pointer Events unify mouse, touch, and pen behind one code path.

   Each row is reordered by moving its real DOM node as the pointer
   crosses a sibling's vertical midpoint, so the on-screen order is
   always the source of truth — no separate "preview" state to keep
   in sync.

   Dragging isn't reachable by keyboard or a screen reader, so the
   handle is also a focusable, ARIA-labelled control that responds to
   Arrow Up / Arrow Down for the same reorder, keeping the feature
   usable without a pointer.

   Move/up tracking is done via listeners on `document`, not on the
   handle itself. The handle is small (~20px) — the instant the
   pointer moves past its edge during a real drag, handle-scoped
   listeners stop receiving events unless pointer capture is engaged
   and behaves correctly, which is one more thing that can silently
   fail. Delegating to `document` while a drag is active is the older,
   more broadly reliable pattern and has no such dependency.
   ============================================================ */
function makeDragReorderable(container, rowSelector, getId, onReordered){
  const rows = () => Array.from(container.querySelectorAll(rowSelector));

  rows().forEach(row=>{
    const handle = row.querySelector('.drag-handle');
    if(!handle) return;
    handle.setAttribute('tabindex','0');
    handle.setAttribute('role','button');
    handle.setAttribute('aria-label','Drag to reorder. Use arrow keys when focused.');

    const onMove = (e)=>{
      // Find the first sibling (in current DOM order) whose midpoint is
      // below the pointer, and drop the row right before it — a single-pass
      // scan that lands on the correct slot in one step even for a large,
      // fast pointer jump (a step-by-step "swap with the first sibling
      // that matches" approach can get stuck one slot early on fast drags).
      const siblings = rows().filter(r=>r!==row);
      let insertBefore = null;
      for(const sib of siblings){
        const rect = sib.getBoundingClientRect();
        const mid = rect.top + rect.height/2;
        if(e.clientY < mid){ insertBefore = sib; break; }
      }
      if(insertBefore) container.insertBefore(row, insertBefore);
      else container.appendChild(row);
    };

    const onUp = ()=>{
      row.classList.remove('dragging');
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      onReordered(rows().map(getId));
    };

    handle.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      row.classList.add('dragging');
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });

    handle.addEventListener('keydown', (e)=>{
      if(e.key!=='ArrowUp' && e.key!=='ArrowDown') return;
      e.preventDefault();
      const list = rows();
      const idx = list.indexOf(row);
      const targetIdx = e.key==='ArrowUp' ? idx-1 : idx+1;
      if(targetIdx<0 || targetIdx>=list.length) return;
      if(e.key==='ArrowUp') container.insertBefore(row, list[targetIdx]);
      else container.insertBefore(row, list[targetIdx].nextSibling);
      onReordered(rows().map(getId));
      handle.focus();
    });
  });
}

/* ---------- Annual Credits ---------- */
function sortedCreditsList(today){
  const withCycle = DATA.credits.map(cr=>({
    // Each row rolls forward a full year to reach its own next occurrence
    // (see the comment on currentCycle) — that's what keeps distinct rows
    // like Q1-Q4 or H1/H2 from drifting into each other's windows.
    cr, cycle: currentCycle(cr.anchor, CYCLE_MONTHS[cr.frequency]||12, 12, today)
  }));
  if(creditsSortMode === 'value'){
    withCycle.sort((a,b)=> b.cr.value - a.cr.value);
  } else if(creditsSortMode === 'daysLeft'){
    withCycle.sort((a,b)=>{
      const da = a.cycle ? daysBetween(today, a.cycle.end) : 9999;
      const db = b.cycle ? daysBetween(today, b.cycle.end) : 9999;
      return da - db;
    });
  }
  // 'manual' mode: keep DATA.credits array order as-is
  return withCycle;
}

function renderCredits(){
  const today = new Date();
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>${DATA.credits.length} recurring credits</h2>
        <div style="display:flex;gap:8px;align-items:center;">
          <select id="creditsSortSelect" class="btn-sm">
            <option value="daysLeft">Sort: days left</option>
            <option value="value">Sort: value</option>
            <option value="manual">Sort: manual order</option>
          </select>
          <button class="btn btn-primary" id="addCreditBtn">+ Add credit</button>
        </div>
      </div>
      <div class="panel-body" id="creditList"></div>
    </div>
  `;
  document.getElementById('creditsSortSelect').value = creditsSortMode;
  const list = document.getElementById('creditList');
  if(DATA.credits.length===0){ list.innerHTML = '<div class="empty">No credits yet.</div>'; }

  const ordered = sortedCreditsList(today);

  const rowsHtml = ordered
    .map(({cr, cycle})=>{
      const card = cardById(cr.cardId);
      const redeemed = redeemedInCycle(cr.id, cycle);
      // Any logged entry counts as redeemed for the period — logging a
      // second one for the same window is blocked (see openRedeemModal),
      // so the row shouldn't offer "Mark redeemed" again just because the
      // logged amount happens to be under the credit's face value.
      const isRedeemed = cycle ? historyEntriesInCycle(cr.id, cycle).length > 0 : false;
      let pill;
      if(!cycle){ pill = {label:'No anchor date', cls:'pill-gray'}; }
      else if(isRedeemed){ pill = {label:'Redeemed', cls:'pill-green'}; }
      else { pill = statusForDays(daysBetween(today, cycle.end), 60); }
      const daysLeft = cycle ? daysBetween(today, cycle.end) : null;

      return `
      <div class="list-row" data-row-id="${cr.id}">
        <div class="drag-handle">⠿</div>
        <div class="main-col">
          <div class="title">${cr.name}</div>
          <div class="subtitle">${card?card.name:'(unlinked)'} · ${cr.frequency} · resets ${cycle?fmtDate(cycle.end):'—'}${cr.autoRedeem?' · Auto-credited, no action needed':''}</div>
        </div>
        <div class="amount">$${cr.value}</div>
        <div><span class="pill ${pill.cls}">${pill.label}</span></div>
        <div class="days">${daysLeft!==null? (daysLeft>=0? daysLeft+' days left' : 'overdue') : ''}</div>
        <div class="actions">
          ${!isRedeemed && cycle && !cr.autoRedeem ? `<button class="btn btn-sm btn-primary" data-mark-cr="${cr.id}">Mark redeemed</button>` : ''}
          ${isRedeemed ? `<button class="btn btn-sm" data-editredemption-cr="${cr.id}">Edit amount</button><button class="btn btn-sm btn-danger" data-unredeem-cr="${cr.id}">Unredeem</button>` : ''}
          <button class="btn btn-sm" data-edit-cr="${cr.id}">Edit</button>
          <button class="btn btn-sm btn-danger" data-del-cr="${cr.id}">Delete</button>
        </div>
      </div>`;
    }).join('');
  list.innerHTML = rowsHtml || '<div class="empty">No credits yet.</div>';

  document.getElementById('addCreditBtn').onclick = ()=>openCreditModal();
  document.getElementById('creditsSortSelect').onchange = (e)=>{ creditsSortMode = e.target.value; renderCredits(); };
  list.querySelectorAll('[data-edit-cr]').forEach(b=>b.onclick=()=>openCreditModal(b.dataset.editCr));
  list.querySelectorAll('[data-del-cr]').forEach(b=>b.onclick=()=>{ if(confirm('Delete this credit?')){ DATA.credits=DATA.credits.filter(x=>x.id!==b.dataset.delCr); saveData(); renderCredits(); }});
  list.querySelectorAll('[data-mark-cr]').forEach(b=>b.onclick=()=>openRedeemModal('cr', b.dataset.markCr));
  list.querySelectorAll('[data-editredemption-cr]').forEach(b=>{
    const id = b.dataset.editredemptionCr;
    const row = ordered.find(o=>o.cr.id===id);
    b.onclick = ()=>{
      const entries = historyEntriesInCycle(id, row.cycle);
      if(entries.length === 1) openEditLinkedAmountModal(entries[0].id);
      else { toast('Multiple redemptions logged for this period — edit them from the Redemption Log tab.'); switchView('history'); }
    };
  });
  list.querySelectorAll('[data-unredeem-cr]').forEach(b=>{
    const id = b.dataset.unredeemCr;
    const row = ordered.find(o=>o.cr.id===id);
    b.onclick = ()=>unredeemItem('cr', id, row.cycle);
  });

  makeDragReorderable(list, '.list-row', row=>row.dataset.rowId, (newOrderIds)=>{
    const wasManual = creditsSortMode === 'manual';
    DATA.credits = newOrderIds.map(id=>DATA.credits.find(c=>c.id===id));
    creditsSortMode = 'manual';
    saveData();
    if(!wasManual){ toast('Switched to manual order'); renderCredits(); }
    else { document.getElementById('creditsSortSelect').value = 'manual'; }
  });
}

function openRedeemModal(kind, sourceId){
  const item = kind==='cr' ? DATA.credits.find(x=>x.id===sourceId) : DATA.freeNights.find(x=>x.id===sourceId);

  // Hard guard against logging the same item twice in the same cycle. The
  // "Mark redeemed"/"Mark used" button is already hidden once something's
  // logged, but that's just UI — this check is the real gate, so a stale
  // render, a double-click before re-render, or any other path into this
  // function can't create a second entry for the same window.
  const today = new Date();
  const cycle = kind==='cr'
    ? currentCycle(item.anchor, CYCLE_MONTHS[item.frequency]||12, 12, today)
    : currentCycle(item.anchor, 12, 12, today);
  if(cycle && historyEntriesInCycle(sourceId, cycle).length > 0){
    toast('Already logged for this period — edit the amount or unredeem it first.');
    return;
  }

  const defaultAmount = kind==='cr' ? item.value : (item.cashValue||'');
  // A credit always has a known face value (its "value" field), so it can
  // always default the Amount field. A free night doesn't — its cash value
  // depends on which hotel you actually book — so a brand-new certificate
  // with nothing logged yet opens with the Amount field blank. Left
  // unvalidated, an accidental blank save silently logged a $0 redemption,
  // and because "used" status only counts redeemed > 0, that $0 entry then
  // didn't even register as Redeemed — clicking "Mark used" looked like it
  // had silently done nothing. Requiring a real value up front fixes both.
  const needsValue = kind==='fn' && !defaultAmount;
  showModal(`
    <div class="modal-head"><h3>Log redemption</h3><button class="close-x" id="modalClose">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Date used</label><input id="f_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>Amount ($)</label><input id="f_amount" type="number" value="${defaultAmount}" placeholder="${needsValue?'Estimated cash value of the stay you booked':''}"></div>
      ${needsValue ? `<div class="hint">Free nights don't have a fixed dollar value — enter what the stay would have cost in cash (check the hotel's rate for your dates) so it counts toward value realized.</div>` : ''}
      ${kind==='fn' ? `<div class="field"><label>Property (optional)</label><input id="f_property" value="${escAttr(item.property||'')}"></div>` : ''}
    </div>
    <div class="modal-foot">
      <button class="btn" id="modalCancel">Cancel</button>
      <button class="btn btn-primary" id="modalSave">Save</button>
    </div>
  `);
  document.getElementById('modalSave').onclick = ()=>{
    // Re-check at save time too — the modal can sit open for a while (or a
    // sync from another device could land) before Save is actually clicked.
    if(historyEntriesInCycle(sourceId, cycle).length > 0){
      toast('Already logged for this period — edit the amount or unredeem it first.');
      closeModal();
      if(kind==='cr') renderCredits(); else renderFreeNights();
      return;
    }
    const amount = Number(val('f_amount'))||0;
    if(kind==='fn' && amount <= 0){
      toast('Enter the cash value of this free night before marking it used');
      return;
    }
    const entry = {
      id: uid('rh'), date: val('f_date'), cardId: item.cardId, type: kind==='cr'?'Credit':'Free Night',
      sourceId: item.id, desc: kind==='cr'?item.name:item.desc, amount
    };
    DATA.history.push(entry);
    if(kind==='fn'){
      item.cashValue = entry.amount;
      const propEl = document.getElementById('f_property');
      if(propEl) item.property = propEl.value;
    }
    saveData(); closeModal();
    if(kind==='cr') renderCredits(); else renderFreeNights();
    toast('Redemption logged');
  };
}

/* ---------- Free Nights ---------- */
function sortedFreeNightsList(today){
  const withCycle = DATA.freeNights.map(fn=>({
    fn, cycle: currentCycle(fn.anchor, 12, 12, today)
  }));
  if(fnSortMode === 'value'){
    withCycle.sort((a,b)=> (b.fn.cashValue||0) - (a.fn.cashValue||0));
  } else if(fnSortMode === 'daysLeft'){
    withCycle.sort((a,b)=>{
      const ea = effectiveExpiration(a.fn, a.cycle);
      const eb = effectiveExpiration(b.fn, b.cycle);
      const da = ea ? daysBetween(today, ea) : 9999;
      const db = eb ? daysBetween(today, eb) : 9999;
      return da - db;
    });
  }
  // 'manual' mode: keep DATA.freeNights array order as-is
  return withCycle;
}

        <div style="display:flex;gap:8px;align-items:center;">

  document.getElementById('addHistBtn').onclick = ()=>openHistModal();

      DATA.history = newOrderIds.map(id=>DATA.history.find(h=>h.id===id));

      saveData();
      if(!wasManual){ toast('Switched to manual order'); renderHistory(); }
      else { document.getElementById('histSortSelect').value = 'manual'; }
    });
  }

function openHistModal(id){
  const editing = !!id;

      DATA.history.push({ id:uid('rh'), date: val('f_date'), cardId: val('f_card'), type: val('f_type'), sourceId:null, desc, amount });

    saveData(); closeModal(); renderHistory(); toast(editing?'Redemption updated':'Redemption logged');

/* ============================================================
   MODAL / TOAST HELPERS
   ============================================================ */
function showModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('modalCancel').onclick = closeModal;
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });

function val(id){ return document.getElementById(id).value; }
function escAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============================================================
   EXPORT / IMPORT
   ============================================================ */
document.getElementById('exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `hotel-card-tracker-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
};
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.cards || !parsed.credits) throw new Error('bad format');
      DATA = migrateData(parsed); saveData(); runAutoRedemptions(); renderYearSelect(); switchView(currentView);
      toast('Data imported');
    }catch(err){ alert('Could not read that file — is it a tracker backup JSON?'); }
  };
  reader.readAsText(file);
  e.target.value = '';
};

/* ============================================================
   INIT
   ============================================================ */
document.querySelectorAll('#nav button').forEach(b=> b.onclick = ()=> switchView(b.dataset.view));
document.getElementById('yearSelect').onchange = (e)=>{ selectedYear = Number(e.target.value); switchView(currentView); };
document.getElementById('addYearBtn').onclick = addTrackedYear;

runAutoRedemptions();
renderYearSelect();
switchView('dashboard');

// Reconcile with the cloud right after first paint (non-blocking — the app
// is already usable from local data by the time this resolves).
bootstrapSync();

// Whenever this tab/window becomes active again (switching back from
// another app, waking the laptop, reopening on the phone), either flush any
// change that failed to sync while inactive, or pull in anything saved from
// another device meanwhile. Also re-check for any auto-redeemed benefits
// whose date may have arrived while the tab was in the background.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState !== 'visible') return;
  if(syncPending) pushToCloud();
  else bootstrapSync();
  if(runAutoRedemptions()) switchView(currentView);
});
</script>
</body>
</html>
