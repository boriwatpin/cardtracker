<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hotel Credit Card Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#1f3864; --navy-light:#2e4a7d; --navy-dark:#152647;
    --bg:#f4f6fb; --card-bg:#ffffff; --border:#e5e8f0;
    --text:#1a1d29; --text-muted:#6b7280; --text-soft:#94a0b4;
    --green:#16a34a; --green-bg:#e7f7ed;
    --amber:#d97706; --amber-bg:#fef3c7;
    --red:#dc2626; --red-bg:#fde8e8;
    --gray:#6b7280; --gray-bg:#eef0f4;
    --accent:#b8902f; --accent-bg:#faf3e2;
    --radius:14px; --radius-sm:8px;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --shadow-md:0 4px 12px rgba(16,24,40,.10);
    /* ENHANCEMENT (dark mode): these three were previously hardcoded hex
       values sprinkled through the rules below (inputs, hover states, the
       modal). Pulling them into variables here is what makes the dark
       theme override below actually work without touching every rule. */
    --input-bg:#ffffff;
    --surface-tile:#fbfcfe;
    --surface-hover:#fafbfd;
    --border-hover:#d3dae6;
  }
  /* ENHANCEMENT (dark mode): toggled by adding data-theme="dark" to <html>.
     Every color in the app is already driven by the variables above, so the
     whole UI re-themes from this one block — no per-component dark-mode
     rules needed elsewhere. */
  html[data-theme="dark"]{
    --navy:#3a5a94; --navy-light:#4d70ab; --navy-dark:#24344f;
    --bg:#11151c; --card-bg:#1a1f29; --border:#2b3140;
    --text:#e7e9ef; --text-muted:#9aa1b2; --text-soft:#6d7484;
    --green:#3ecf72; --green-bg:rgba(62,207,114,.14);
    --amber:#f2a93b; --amber-bg:rgba(242,169,59,.14);
    --red:#f0665f; --red-bg:rgba(240,102,95,.14);
    --gray:#9aa1b2; --gray-bg:#232938;
    --accent:#dcb567; --accent-bg:rgba(220,181,103,.14);
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.45);
    --shadow-md:0 4px 14px rgba(0,0,0,.5);
    --input-bg:#232938;
    --surface-tile:#1f2531;
    --surface-hover:#242a38;
    --border-hover:#3a4358;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}
  a{color:inherit;}
  .app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{width:240px;background:linear-gradient(180deg,var(--navy) 0%,var(--navy-dark) 100%);color:#fff;
    display:flex;flex-direction:column;padding:22px 14px;position:fixed;top:0;bottom:0;left:0;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px 10px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:16px;}
  .brand .logo{font-size:22px;}
  .brand .title{font-size:15px;font-weight:700;line-height:1.25;}
  .brand .sub{font-size:11px;color:rgba(255,255,255,.55);font-weight:400;}
  .nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav button{display:flex;align-items:center;gap:10px;background:none;border:none;color:rgba(255,255,255,.75);
    padding:10px 12px;border-radius:10px;font-size:14px;cursor:pointer;text-align:left;transition:.15s;font-family:inherit;}
  .nav button:hover{background:rgba(255,255,255,.08);color:#fff;}
  .nav button.active{background:rgba(255,255,255,.14);color:#fff;font-weight:600;}
  .nav .icon{width:18px;text-align:center;}
  .sidebar-foot{font-size:11px;color:rgba(255,255,255,.4);padding:10px;line-height:1.5;}

  /* ---------- Main ---------- */
  .main{margin-left:240px;flex:1;padding:26px 32px 60px 32px;max-width:1280px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
  .topbar h1{font-size:22px;margin:0 0 4px 0;}
  .topbar p.desc{margin:0;color:var(--text-muted);font-size:13.5px;max-width:640px;}
  .topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .sync-status{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap;}
  .sync-status:empty{display:none;}
  .sync-syncing{color:var(--amber);background:rgba(217,164,65,.12);}
  .sync-synced{color:var(--green);background:rgba(76,175,110,.12);}
  .sync-offline{color:var(--red);background:rgba(217,83,79,.12);}

  select, input, textarea{font-family:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--border);
    border-radius:8px;background:var(--input-bg);color:var(--text);}
  select:focus, input:focus, textarea:focus{outline:2px solid var(--navy-light);outline-offset:-1px;}

  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);
    padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit;}
  .btn:hover{background:var(--gray-bg);}
  .btn-primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  .btn-primary:hover{background:var(--navy-light);}
  .btn-danger{color:var(--red);}
  .btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px;}
  .btn-ghost{border:none;background:none;}

  /* ---------- KPI cards ---------- */
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
  .kpi{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
  .kpi .label{font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .kpi .value{font-size:24px;font-weight:700;margin-top:6px;}
  .kpi .value.pos{color:var(--green);}
  .kpi .value.neg{color:var(--red);}

  /* ---------- Cards / lists ---------- */
  .panel{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
  .panel-head h2{font-size:15px;margin:0;}
  .panel-body{padding:6px 0;}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:16px;}
  .card-tile{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;background:var(--surface-tile);transition:.15s;}
  .card-tile:hover{box-shadow:var(--shadow-md);border-color:var(--border-hover);}
  .card-tile .name{font-weight:700;font-size:14px;margin-bottom:2px;}
  .issuer-badge{display:inline-flex;align-items:center;justify-content:center;padding:2px 7px;
    border-radius:5px;font-size:10px;font-weight:800;letter-spacing:.03em;white-space:nowrap;line-height:1.5;}
  .card-tile .meta{font-size:12px;color:var(--text-muted);margin-bottom:10px;}
  .card-tile .row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
  .card-tile .row .l{color:var(--text-muted);}
  .card-tile .row .r{font-weight:600;}
  .card-tile .actions{margin-top:10px;display:flex;gap:6px;}

  .list-row{display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid var(--border);}
  .list-row:last-child{border-bottom:none;}
  .list-row:hover{background:var(--surface-hover);}
  .list-row .main-col{flex:1;min-width:0;}
  /* MOBILE: forces a flex line-break at this exact point once the phone
     breakpoint below turns .list-row into a wrapping flex container.
     display:contents means this element generates no box at all on
     desktop — it isn't a flex item, so it can't add stray gap spacing or
     otherwise touch the existing desktop row layout in any way. */
  .row-break{display:contents;}

  /* MOBILE: Dashboard's "by card" table and the Redemption Log table both
     have too many columns to squeeze onto a ~390px phone screen readably.
     Rather than reshuffling those columns into cards (a bigger, riskier
     change), wrap the table in a horizontally scrollable strip so it's
     still fully readable — just a sideways swipe away — while remaining
     completely unchanged on desktop. */
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  /* ---------- Drag-to-reorder handle (pointer-events based: mouse + touch + keyboard) ---------- */
  .drag-handle{cursor:grab;color:var(--text-soft);font-size:16px;line-height:1;width:20px;text-align:center;
    touch-action:none;user-select:none;border-radius:6px;padding:4px 0;}
  .drag-handle:hover{color:var(--text-muted);background:var(--gray-bg);}
  .drag-handle:focus-visible{outline:2px solid var(--navy-light);outline-offset:1px;}
  .list-row.dragging, tr.dragging{opacity:.45;background:var(--gray-bg) !important;}
  .list-row.drag-active .drag-handle{cursor:grabbing;}
  .list-row .title{font-weight:600;font-size:13.5px;}
  .list-row .subtitle{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .list-row .amount{font-weight:700;font-size:14px;width:80px;text-align:right;}
  .list-row .days{width:120px;font-size:12.5px;color:var(--text-muted);text-align:right;}
  .list-row .actions{display:flex;gap:6px;}

  .pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .pill-green{background:var(--green-bg);color:var(--green);}
  .pill-amber{background:var(--amber-bg);color:var(--amber);}
  .pill-red{background:var(--red-bg);color:var(--red);}
  .pill-gray{background:var(--gray-bg);color:var(--gray);}
  .pill-accent{background:var(--accent-bg);color:var(--accent);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);
     padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface-hover);}
  td{padding:11px 20px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--surface-hover);}

  .empty{padding:30px;text-align:center;color:var(--text-soft);font-size:13.5px;}

  .chart-wrap{padding:18px 20px;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,20,35,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .overlay.open{display:flex;}
  .modal{background:var(--card-bg);border-radius:var(--radius);width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .modal-head h3{margin:0;font-size:16px;}
  .modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12.5px;font-weight:600;color:var(--text-muted);}
  .field input, .field select, .field textarea{width:100%;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
  .close-x{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-muted);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .hint{font-size:11.5px;color:var(--text-soft);}

  .toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));right:22px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;
    font-size:13.5px;box-shadow:var(--shadow-md);z-index:200;display:none;}
  .toast.show{display:block;animation:fadein .2s;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  @media (max-width:900px){
    .sidebar{position:relative;width:100%;height:auto;flex-direction:row;overflow-x:auto;padding:12px;}
    .brand{display:none;}
    .nav{flex-direction:row;}
    .main{margin-left:0;padding:18px;}
  }

  /* ============================================================
     PHONE (iPhone 16 Pro and similar — logical viewport ~402x874pt
     in portrait). Layered on top of the tablet breakpoint above, which
     already handles the sidebar->top-nav conversion; this pass tightens
     spacing and, most importantly, restructures the dense .list-row
     (Credits/Free Nights/History) layout, which otherwise tries to fit a
     title, amount, status pill, days-left, and up to 4 action buttons all
     on one line — comfortably possible at desktop widths, not at ~370px
     of usable content width on a phone.
     ============================================================ */
  @media (max-width:480px){
    .main{padding:14px 14px 40px 14px;}
    .topbar{margin-bottom:16px;}
    .topbar h1{font-size:19px;}
    .topbar-actions{gap:6px;}
    .topbar-actions .btn, .topbar-actions select{font-size:12.5px;padding:7px 9px;}
    .nav button{font-size:12.5px;padding:9px 10px;}

    /* 2-column KPI grid reads better than 1-per-row on a phone-width screen. */
    .kpi-row{grid-template-columns:1fr 1fr;gap:10px;}
    .kpi{padding:12px 14px;}
    .kpi .value{font-size:19px;}

    .panel-head{padding:14px 16px;flex-wrap:wrap;row-gap:10px;}
    .card-grid{padding:12px;gap:12px;}

    /* The core fix: let rows wrap instead of squeezing everything onto one
       line. .row-break (added at the two spots that most need a hard line
       split — right before "amount" and right before "actions" in the
       credit/free-night row templates) forces: line 1 = title/subtitle,
       line 2 = amount + status + days-left, line 3 = action buttons. */
    .list-row{flex-wrap:wrap;padding:12px 16px;row-gap:8px;}
    .row-break{display:block;flex-basis:100%;height:0;}
    .list-row .amount{width:auto;text-align:left;}
    .list-row .days{width:auto;text-align:left;}
    .list-row .actions{flex:1 1 100%;flex-wrap:wrap;}
    .list-row .actions .btn{padding:7px 11px;font-size:12.5px;}

    table{min-width:560px;} /* paired with .table-scroll wrapper in the JS */

    /* Two-field modal rows (e.g. Issuer + Annual fee) stack instead of
       squeezing two inputs into a ~350px-wide modal body. */
    .field-row{flex-direction:column;gap:14px;}
    .modal{max-width:100%;}
    .modal-foot{flex-wrap:wrap;}
    .overlay{padding:12px;}
  }
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="brand">
      <div class="logo">🏨</div>
      <div>
        <div class="title">Hotel Card Tracker</div>
        <div class="sub">Credits &amp; free nights</div>
      </div>
    </div>
    <div class="nav" id="nav">
      <button data-view="dashboard" class="active"><span class="icon">📊</span> Dashboard</button>
      <button data-view="cards"><span class="icon">💳</span> Cards</button>
      <button data-view="credits"><span class="icon">🔁</span> Annual Credits</button>
      <button data-view="freenights"><span class="icon">🌙</span> Free Nights</button>
      <button data-view="history"><span class="icon">📜</span> Redemption Log</button>
    </div>
    <div class="sidebar-foot">
      Synced automatically across your devices.<br>Export is still a good idea as a backup.
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p class="desc" id="pageDesc">Annual fee vs. value realized, by card.</p>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-sm" id="themeToggleBtn" title="Toggle dark mode">🌙</button>
        <span id="syncStatus" class="sync-status"></span>
        <select id="yearSelect"></select>
        <button class="btn btn-sm" id="addYearBtn" title="Add a future year to the dropdown">+ Add year</button>
        <button class="btn btn-sm btn-danger" id="deleteYearBtn" title="Permanently delete redemption history for a year">🗑 Delete year</button>
        <button class="btn" id="exportBtn">⬇ Export</button>
        <button class="btn" id="importBtn">⬆ Import</button>
        <input type="file" id="importFile" accept="application/json" style="display:none;">
      </div>
    </div>

    <div id="content"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================

   SEED/DATA loading below) purely so there's no visible flash of the light
   theme before this runs. This is a local-only display preference — it

   bearing on your cards/credits/history at all.

  try{
    const saved = localStorage.getItem(THEME_KEY);

})();

const DIRTY_KEY = STORE_KEY + '_dirty'; // FIX: persists across reloads/tab-closes

// Local-only load — instant, works offline, used for first paint on every
// page open. Cloud sync (below) reconciles with this right after.
function loadLocalData(){
  let data;
  try{
    const raw = localStorage.getItem(STORE_KEY);
    data = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(SEED));
  }catch(e){
    console.warn('Could not read saved data, using seed.', e);
    data = JSON.parse(JSON.stringify(SEED));
  }
  data = migrateData(data);
  return data;
}

// One-time migrations applied to data saved by older versions of this file.
function migrateData(data){
  if(!data._version || data._version < 2){
    // v2: dropped 2025 redemption history entries permanently, and introduced
    // an explicit "tracked years" list so future years can be added on demand.
    data.history = (data.history||[]).filter(h => parseDate(h.date).getFullYear() !== 2025);
    const existing = new Set(data.trackedYears || []);
    [2027, 2028, 2029].forEach(y => existing.add(y));
    data.trackedYears = Array.from(existing).sort((a,b)=>a-b);
    data._version = 2;
  }
  if(data._version < 3){
    // v3 (superseded by v4 below): had briefly merged the four "$50 Flight
    // Credit - Q1..Q4" rows and the two "$200 Hilton Resort Credit - H1/H2"
    // rows into one calendar-aligned credit each, to stop them from
    // converging onto the same displayed date. Left as a no-op passthrough
    // since v4 replaces this approach entirely — kept only so `_version`
    // still advances correctly for anyone who saved data before v4 shipped.
    data._version = 3;
  }
  if(data._version < 4){
    // v4: restores four separate Q1-Q4 rows and two separate H1/H2 rows
    // (each is tracked as its own distinct benefit, as requested) and fixes
    // the actual bug a different way — see the comment on currentCycle().
    // In short: each row now rolls forward a full 12 months to reach its
    // *next own occurrence* instead of rolling forward by its stated
    // frequency (3 or 6 months), which was what made separate rows drift
    // into each other's windows over time.
    const cr4 = data.credits.find(cr=>cr.id==='cr4');
    if(cr4){
      delete cr4.calendarAligned;
      if(cr4.name === '$200 Hilton Resort Credit (Semi-Annual: Jan-Jun / Jul-Dec)') cr4.name = '$200 Hilton Resort Credit - H1 (Jan-Jun)';
    }
    if(!data.credits.find(cr=>cr.id==='cr5')){
      data.credits.push({id:'cr5', cardId:'c5', name:'$200 Hilton Resort Credit - H2 (Jul-Dec)', value:200, frequency:'Semi-Annual', anchor:'2026-07-01'});
    }
    const cr6 = data.credits.find(cr=>cr.id==='cr6');
    if(cr6){
      delete cr6.calendarAligned;
      if(cr6.name === '$50 Hilton Flight Credit (Quarterly: Jan-Mar / Apr-Jun / Jul-Sep / Oct-Dec)') cr6.name = '$50 Flight Credit - Q1';
    }
    ['cr7','cr8','cr9'].forEach((id,i)=>{
      if(!data.credits.find(cr=>cr.id===id)){
        const month = String((i+1)*3 + 1).padStart(2,'0');
        data.credits.push({id, cardId:'c5', name:`$50 Flight Credit - Q${i+2}`, value:50, frequency:'Quarterly', anchor:`2026-${month}-01`});
      }
    });
    (data.credits||[]).forEach(cr=>delete cr.calendarAligned);
    data._version = 4;
  }
  if(data._version < 5){
    // v5: the Capital One Venture X 10,000 Anniversary Bonus Miles credit is
    // auto-applied by Capital One every year (no spending/booking needed to
    // "redeem" it) — flag it so the app logs it automatically instead of
    // waiting for a manual "Mark redeemed" click, and align its anchor to
    // Dec 31 (the actual date it posts) so the auto-check fires on schedule.
    const cr14 = data.credits.find(cr=>cr.id==='cr14');
    if(cr14){
      if(cr14.anchor === '2025-12-24') cr14.anchor = '2025-12-31';
      cr14.autoRedeem = true;
    }
    data._version = 5;
  }
  return data;
}
function saveData(){
  localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
  // FIX: mark dirty *before* attempting the push, and persist that flag to
  // localStorage (not just an in-memory variable). If the tab is closed or

  // must not be silently overwritten by an older cloud copy.

}

let syncPending = false; // true if we have local changes not yet confirmed saved to the cloud

function setSyncStatus(state){
  const el = document.getElementById('syncStatus');
  if(!el) return;

// Fetch the shared row from Supabase.
// FIX: returns a tagged result instead of a bare null, because the old code
// collapsed two very different situations — "no row saved yet" vs. "the
// request itself failed" (network blip, timeout, RLS error) — into the same
// `null` return value. bootstrapSync() then treated *any* null as "nothing
// there yet" and responded by pushing local data up, unconditionally
// overwriting the cloud. That meant a plain network hiccup on one device
// could silently clobber data another device had already saved. Now the
// caller can tell the two cases apart and only push-as-first-write when it's
// actually true.
async function pullFromCloud(){
  if(!supabaseClient) return {status:'no-client'};
  try{
    const { data, error } = await supabaseClient
      .from('tracker_data')
      .select('data, updated_at')
      .eq('id', 'main')
      .maybeSingle();
    if(error) throw error;
    return data ? {status:'ok', row:data} : {status:'empty'};
  }catch(e){
    console.warn('Cloud pull failed', e);
    return {status:'error'};
  }
}

// Push the current in-memory DATA up to Supabase.
async function pushToCloud(){
  if(!supabaseClient) return;
  setSyncStatus('syncing');
  const nowIso = new Date().toISOString();
  try{
    const { error } = await supabaseClient
      .from('tracker_data')
      // ENHANCEMENT (security): edit_secret travels as its own column,
      // deliberately kept out of the `data` JSON blob — it's not part of
      // your tracker data, it's a gate the RLS policy checks, so it should
      // never end up inside DATA, get exported in a backup, or show up
      // anywhere migrateData()/valueRealizedForCardYear()/etc. could see it.
      .upsert({ id: 'main', data: DATA, updated_at: nowIso, edit_secret: APP_EDIT_SECRET });
    if(error) throw error;
    localStorage.setItem(SYNCED_AT_KEY, nowIso);
    localStorage.removeItem(DIRTY_KEY); // FIX: only clear "unsynced" once the push actually succeeds
    syncPending = false;
    setSyncStatus('synced');
  }catch(e){
    console.warn('Cloud push failed — will retry next time this tab becomes active or reloads.', e);
    syncPending = true;
    setSyncStatus('offline');
  }
}

// Reconcile local data with the cloud. Safe to call anytime: it only
// overwrites local DATA if the cloud copy is confirmed newer than the last
// version this device synced (so it never clobbers your own unsaved edits).
async function bootstrapSync(){
  // FIX: if a previous edit never got confirmed as pushed (DIRTY_KEY
  // survives reloads/tab closes, unlike the old in-memory-only
  // `syncPending`), push it before doing anything else. Pulling first here
  // risked overwriting that unsynced local edit with an older cloud copy —
  // which is the "my changes keep reverting" bug.
  if(localStorage.getItem(DIRTY_KEY) === '1'){
    await pushToCloud();
    return;
  }

  const result = await pullFromCloud();

  if(result.status === 'error'){
    // FIX: a failed/errored pull is NOT the same as "no data saved yet".
    // Don't touch local data and don't push — just reflect that we
    // couldn't reach the cloud this time. The next successful sync
    // (reload, tab focus, or next edit) will reconcile properly.
    setSyncStatus('offline');
    return;
  }

  if(result.status === 'no-client' || result.status === 'empty'){
    // Genuinely nothing saved to the cloud yet — seed it with what we have.
    if(supabaseClient) await pushToCloud();
    return;
  }

  const remote = result.row;
  const lastSyncedAt = localStorage.getItem(SYNCED_AT_KEY);
  if(lastSyncedAt && remote.updated_at && new Date(remote.updated_at) <= new Date(lastSyncedAt)){
    // Cloud hasn't changed since we last synced from this device — nothing to pull.
    setSyncStatus('synced');
    return;
  }
  DATA = migrateData(remote.data);
  localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
  localStorage.setItem(SYNCED_AT_KEY, remote.updated_at);
  runAutoRedemptions();
  renderYearSelect();
  switchView(currentView);
  setSyncStatus('synced');
  // UI IMPROVEMENT: the sync status badge is small and easy to miss, so a
  // remote update overwriting what's on screen could happen silently. Once
  // the page has already rendered once, surface it with a toast too — but
  // not on the very first load, where "updating" from the cloud is just
  // normal startup, not a surprise.
  if(hasRenderedOnce) toast('Updated with changes from another device');
}

/* ============================================================
   DATE / CYCLE HELPERS
   ============================================================ */
const MS_DAY = 86400000;
function parseDate(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDate(d){ if(!d) return '—'; return d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); }
function addMonths(date, months){ const d = new Date(date); d.setMonth(d.getMonth()+months); return d; }
function daysBetween(a,b){ return Math.round((b-a)/MS_DAY); }

const CYCLE_MONTHS = {'Annual':12, 'Semi-Annual':6, 'Quarterly':3, 'Per Stay':12};

// Find the currently-active (or next upcoming) window for a recurring
// credit: a window of `durationMonths` starting at `anchorStr`, which
// recurs every `rollMonths` months.
//
// These two numbers are deliberately kept separate. A card can offer, say,
// four *distinct* $50 quarterly credits (Q1, Q2, Q3, Q4), each tracked as
// its own row so they can be seen and reordered independently. Each of
// those rows is a 3-month-long window (durationMonths=3, matching
// "Quarterly"), but the row itself only comes back around once a year
// (rollMonths=12) — Q1 stays Q1 forever, it never rolls forward into Q2's
// slot. Using the same number for both (the original bug) made every
// row's window walk forward through the *other* rows' slots every cycle,
// so after enough time passed all four rows converged onto the same
// displayed dates and looked like duplicates.
//
// Only forward-rolling is needed: an anchor dated later than today simply
// means this row's window hasn't started yet, which is already a valid,
// correct "upcoming" result — nothing needs to be rolled backward to reach
// it.
function currentCycle(anchorStr, durationMonths, rollMonths, today){
  const anchor = parseDate(anchorStr);
  if(!anchor) return null;
  let start = anchor, end = addMonths(anchor, durationMonths), nextStart = addMonths(anchor, rollMonths);
  // Roll forward while the *next* occurrence has already begun — not just
  // while this slot's own narrow window has ended. For a quarterly credit,
  // durationMonths (3) is shorter than rollMonths (12), so the window is
  // "over" on paper for 9 months before the row comes back around. Rolling
  // on end<=today jumped straight to next year's slot the moment the
  // quarter closed, even if you hadn't redeemed it yet — so a redemption
  // logged any time after the quarter ended no longer fell inside the
  // (now future) window and never showed as Redeemed. This row should stay
  // "current" — available to mark redeemed, even if overdue — for the
  // whole rollMonths period, only actually advancing once the *next*
  // occurrence's start date arrives.
  while(nextStart <= today){
    start = nextStart;
    end = addMonths(start, durationMonths);
    nextStart = addMonths(start, rollMonths);
  }
  return {start, end, nextStart};
}

// FIX: static, non-"today"-relative occurrence of a row for an arbitrary
// calendar year. Every credit/free-night row in this app rolls forward in
// exactly 12-month steps (see currentCycle above), so a row's occurrence in
// a given year always starts on the anchor's month/day, just with that
// year substituted in — no need to walk forward one cycle at a time.
function occurrenceForYear(anchorStr, durationMonths, year){
  const anchor = parseDate(anchorStr);
  if(!anchor) return null;
  // BUG FOUND IN RE-SCAN: without this guard, selecting a year before the
  // credit/free-night's anchor year (e.g. viewing 2024 for something first
  // added with a 2027 anchor) would still synthesize a backdated occurrence
  // for it — showing a "2024" row for a benefit that didn't exist until
  // 2027. This row simply has no occurrence in years before its anchor.
  if(year < anchor.getFullYear()) return null;
  const start = addMonths(anchor, (year - anchor.getFullYear()) * 12);
  const end = addMonths(start, durationMonths);
  const nextStart = addMonths(start, 12);
  return {start, end, nextStart};
}

// FIX: the Credits and Free Nights tabs previously ignored the year
// selector entirely — they always showed whatever cycle was "live" right
// now, regardless of which year was picked in the dropdown. This picks the
// right cycle for whatever year is currently selected: the real, "today"
// relative cycle when that cycle's own year matches the selection (so all
// the existing overdue/countdown behavior is preserved unchanged for the
// current period), or a plain calendar-year occurrence otherwise (for
// reviewing a past year or previewing a future one).
function cycleForSelectedYear(anchorStr, durationMonths, today){
  const live = currentCycle(anchorStr, durationMonths, 12, today);
  if(live && live.start.getFullYear() === selectedYear) return {cycle: live, isLive:true};
  return {cycle: occurrenceForYear(anchorStr, durationMonths, selectedYear), isLive:false};
}

// FIX: the "Log redemption" modal always defaulted the date field to the
// real today's date, even while reviewing a past or future year — so
// logging a 2024 redemption while looking at the 2024 tab required manually
// retyping the date every time. Defaults to today only if today actually
// falls inside the row's window; otherwise defaults to the window's start.
function defaultRedeemDate(cycle){
  const today = new Date();
  if(!cycle) return toISODate(today);
  if(today >= cycle.start && today < cycle.nextStart) return toISODate(today);
  return toISODate(cycle.start);
}

// NEW FEATURE: annual fee renewal date tracking. Deliberately its own tiny
// helper rather than reusing currentCycle()/occurrenceForYear() — an annual
// fee is a single recurring point-in-time event (the day it posts), not a
// multi-month "window" you can act within like a credit or free night, so
// it doesn't need (or want) any of that machinery's window/cycle/duration
// concepts. This never writes to DATA.history and is never read by
// valueRealizedForCardYear() or any Dashboard total — it's purely a
// read-only reminder computed from the card's own `feeAnchor` field, kept
// fully isolated from the credits/free-nights/history data that everything
// else depends on.
function nextOccurrenceOnOrAfter(anchorStr, today){
  const anchor = parseDate(anchorStr);
  if(!anchor) return null;
  let next = anchor;
  while(next < today){
    next = addMonths(next, 12);
  }
  return next;
}

// UI IMPROVEMENT: powers the Dashboard's "expiring soon" reminder banner.
// Always evaluated against the real, live "today" — independent of
// whichever year is selected in the dropdown — since this is meant to
// surface real-world urgency, not a historical/projected view.
function computeUpcomingReminders(){
  const today = new Date();
  const items = [];
  DATA.credits.forEach(cr=>{
    if(cr.autoRedeem) return;
    const cycle = currentCycle(cr.anchor, CYCLE_MONTHS[cr.frequency]||12, 12, today);
    if(!cycle) return;
    if(historyEntriesInCycle(cr.id, cycle).length > 0) return;
    const daysLeft = daysBetween(today, cycle.end);
    if(daysLeft <= 30) items.push({name: cr.name, daysLeft});
  });
  DATA.freeNights.forEach(fn=>{
    const cycle = currentCycle(fn.anchor, 12, 12, today);
    if(!cycle) return;
    if(redeemedInCycle(fn.id, cycle) > 0) return;
    const expiration = effectiveExpiration(fn, cycle);
    const daysLeft = daysBetween(today, expiration);
    if(daysLeft <= 30) items.push({name: fn.desc, daysLeft});
  });
  // NEW FEATURE: annual fee reminders. Tagged isFee:true so the Dashboard
  // can word these distinctly from credit/free-night reminders ("posts in
  // Xd" rather than "Xd left") — a fee is a cost, not a benefit, and the
  // two shouldn't read the same way in the banner. nextOccurrenceOnOrAfter()
  // always returns a date on/after today, so unlike credits and free
  // nights, a fee reminder can never be negative/"expired" here.
  DATA.cards.forEach(c=>{
    if(!c.feeAnchor) return;
    const nextFee = nextOccurrenceOnOrAfter(c.feeAnchor, today);
    if(!nextFee) return;
    const daysLeft = daysBetween(today, nextFee);
    if(daysLeft <= 30) items.push({name: `${c.name} annual fee`, daysLeft, isFee:true, amount:c.fee});
  });
  return items.sort((a,b)=>a.daysLeft-b.daysLeft);
}

function statusForDays(daysRemaining, planSoonThreshold){
  if(daysRemaining <= 30) return {label:'Urgent', cls:'pill-red'};
  if(daysRemaining <= planSoonThreshold) return {label:'Plan soon', cls:'pill-amber'};
  return {label:'OK', cls:'pill-green'};
}

// A free night certificate's real-world expiration doesn't always match the
// calculated 12-months-from-anchor date exactly (issuers can run a few days
// behind, or grant a one-time extension). `expirationOverride`, if set on
// the certificate, takes precedence over the calculated cycle end for every
// display/sort/status purpose. Falls back to the calculated date otherwise.
function effectiveExpiration(fn, cycle){
  if(fn.expirationOverride){
    const d = parseDate(fn.expirationOverride);
    if(d) return d;
  }
  return cycle ? cycle.end : null;
}

/* Redemption-history entries logged against a given source item that fall
   within the given cycle window (mirrors the SUMIFS logic from the
   spreadsheet, but returns the actual entries so they can be edited or
   un-redeemed, not just summed). */
function historyEntriesInCycle(sourceId, cycle){
  if(!cycle) return [];
  // Match against the full "ownership window" for this slot (start up to
  // the next occurrence's start), not just the narrower nominal end date —
  // see the comment on currentCycle(). This lets a redemption logged after
  // a quarterly/semi-annual credit's own window has closed (but before the
  // next year's occurrence begins) still count toward this row.
  return DATA.history
    .filter(h => h.sourceId === sourceId)
    .filter(h => { const d = parseDate(h.date); return d >= cycle.start && d < cycle.nextStart; });
}
function redeemedInCycle(sourceId, cycle){
  return historyEntriesInCycle(sourceId, cycle).reduce((sum,h) => sum + Number(h.amount||0), 0);
}

// Format a local-time Date back to a 'YYYY-MM-DD' string for storing in a
// history entry. Deliberately not toISOString().slice(0,10) — that converts
// to UTC first, which silently shifts the date back a day for anyone east
// of UTC (most of Asia/Australia) when the local time is midnight.
function toISODate(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// Some benefits (like a card's anniversary bonus) are credited automatically
// by the issuer — there's nothing to spend or book, so requiring a manual
// "Mark redeemed" click doesn't fit. A credit flagged `autoRedeem: true`
// gets its redemption logged by the app itself, the moment its cycle's
// start date (the day it actually posts) arrives, if nothing's been logged
// for that cycle yet. Safe to call anytime — it only ever adds an entry
// once per cycle, same as the manual duplicate-block guard elsewhere.
function runAutoRedemptions(){
  const today = new Date();
  let changed = false;
  DATA.credits.forEach(cr=>{
    if(!cr.autoRedeem) return;
    const cycle = currentCycle(cr.anchor, CYCLE_MONTHS[cr.frequency]||12, 12, today);
    if(!cycle || today < cycle.start) return;
    if(historyEntriesInCycle(cr.id, cycle).length > 0) return;
    DATA.history.push({
      id: uid('rh'), date: toISODate(cycle.start), cardId: cr.cardId, type:'Credit',
      sourceId: cr.id, desc: cr.name, amount: cr.value
    });
    changed = true;
  });
  if(changed) saveData();
  return changed;
}

// Delete every history entry backing a redeemed credit/free-night for its
// current cycle, reverting it to "not redeemed" — the inverse of "Mark
// redeemed" / "Mark used".
function unredeemItem(kind, sourceId, cycle){
  const entries = historyEntriesInCycle(sourceId, cycle);
  if(entries.length === 0) return;
  const label = kind==='cr' ? 'credit' : 'free night';
  const msg = entries.length === 1
    ? `Remove this logged redemption? This ${label} will show as not redeemed again.`
    : `Remove all ${entries.length} logged redemptions for this period? This ${label} will show as not redeemed again.`;
  // FIX: was a native confirm() — replaced with the app's own modal, since
  // confirm()/prompt() can be silently blocked or auto-dismissed inside
  // in-app browsers (Slack, Instagram, some mobile chat webviews), which
  // would make this button appear to do nothing with no visible error.
  showConfirm(msg, ()=>{
    const idsToRemove = new Set(entries.map(e=>e.id));
    DATA.history = DATA.history.filter(h=>!idsToRemove.has(h.id));
    saveData();
    views[currentView].render();
    toast('Redemption removed');
  });
}

// Lightweight edit form for a redemption that's linked to a specific credit

  const entry = DATA.history.find(h=>h.id===entryId);

    </div>

    </div>
  `);
  document.getElementById('modalSave').onclick = ()=>{

// NEW FEATURE: small brand-colored badge chips next to a card's name on the
// Cards tab. These are deliberately NOT the actual official card-network or
// issuer logo artwork (Amex's box icon, Mastercard's interlocking circles,
// Citi's arc, etc.) — reproducing those exact trademarked graphics isn't
// something this app pulls in. Instead this renders a small custom text
// chip using a brand-associated color, which gives the same at-a-glance
// visual recognition without embedding anyone's actual logo file.
// Purely cosmetic — never touches DATA, never affects sorting/matching/any
// other logic, and a card with an unrecognized issuer just falls back to
// its own initials rather than being left without a badge.
function issuerBadge(issuer){
  if(!issuer) return null;
  const name = issuer.toLowerCase();
  const table = [
    { match:'american express', label:'AMEX',     bg:'#016FD0', fg:'#ffffff' },
    { match:'amex',             label:'AMEX',     bg:'#016FD0', fg:'#ffffff' },
    { match:'chase',            label:'CHASE',    bg:'#117ACA', fg:'#ffffff' },
    { match:'capital one',      label:'CAP1',     bg:'#D22630', fg:'#ffffff' },
    { match:'citi',             label:'CITI',     bg:'#003D79', fg:'#ffffff' },
    { match:'discover',         label:'DISCOVER', bg:'#FF6000', fg:'#ffffff' },
    { match:'wells fargo',      label:'WF',       bg:'#D71E2B', fg:'#ffffff' },
    { match:'bank of america',  label:'BOA',      bg:'#012169', fg:'#ffffff' },
    { match:'barclays',         label:'BARCLAYS', bg:'#00AEEF', fg:'#00263a' },
    { match:'us bank',          label:'USB',      bg:'#0c2074', fg:'#ffffff' },
    { match:'visa',             label:'VISA',     bg:'#1a1f71', fg:'#ffffff' },
    { match:'mastercard',       label:'MC',       bg:'#eb001b', fg:'#ffffff' },
  ];
  const found = table.find(t=>name.includes(t.match));
  if(found) return found;
  // Unrecognized issuer — fall back to their own initials on a neutral
  // badge rather than showing nothing at all.
  const initials = issuer.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,4).toUpperCase();
  return initials ? { label: initials, bg:'var(--gray)', fg:'#ffffff' } : null;
}

function allYears(){
  const ys = new Set();
  const now = new Date();
  ys.add(now.getFullYear());
  ys.add(now.getFullYear()+1); // always offer next year, no manual "add sheet" needed
  DATA.history.forEach(h=>ys.add(parseDate(h.date).getFullYear()));
  (DATA.trackedYears||[]).forEach(y=>ys.add(y)); // years explicitly added via "+ Add year"
  return Array.from(ys).sort((a,b)=>b-a);
}

// checkbox is ticked, every year after it too — and removes those years

// *definitions* are untouched; only logged history entries (and the
// tracked-year markers) are removed. The current year and next year always
// stay selectable in the dropdown regardless (see allYears()), since
// they're always offered automatically — but this will still wipe any
// history logged in them if included in the range.

    </div>

    const matches = (y) => includeFuture ? y >= year : y === year;
    const label = includeFuture ? `${year} and every year after it` : `${year}`;

    const historyCount = DATA.history.filter(h => matches(parseDate(h.date).getFullYear())).length;
    showConfirm(`Delete all data for ${label}? This will permanently remove ${historyCount} redemption log entr${historyCount===1?'y':'ies'}. This cannot be undone.`, ()=>{
      DATA.history = DATA.history.filter(h => !matches(parseDate(h.date).getFullYear()));
      if(DATA.trackedYears){
        DATA.trackedYears = DATA.trackedYears.filter(y => !matches(y));

        // whatever the most recent remaining year is (allYears() always
        // includes at least this calendar year and next, so there's always
        // something to land on).
        selectedYear = allYears()[0];

/* ============================================================
   DRAG-TO-REORDER — one shared, generic implementation used by the
   Annual Credits, Free Nights, and Redemption Log lists.

   Built on Pointer Events (not the native HTML5 drag-and-drop API):
   native drag-and-drop simply does not fire on touch screens in any
   mobile browser, which would silently break reordering on phones —
   Pointer Events unify mouse, touch, and pen behind one code path.

   Each row is reordered by moving its real DOM node as the pointer
   crosses a sibling's vertical midpoint, so the on-screen order is
   always the source of truth — no separate "preview" state to keep
   in sync.

   Dragging isn't reachable by keyboard or a screen reader, so the
   handle is also a focusable, ARIA-labelled control that responds to
   Arrow Up / Arrow Down for the same reorder, keeping the feature
   usable without a pointer.

   Move/up tracking is done via listeners on `document`, not on the
   handle itself. The handle is small (~20px) — the instant the
   pointer moves past its edge during a real drag, handle-scoped
   listeners stop receiving events unless pointer capture is engaged
   and behaves correctly, which is one more thing that can silently
   fail. Delegating to `document` while a drag is active is the older,
   more broadly reliable pattern and has no such dependency.
   ============================================================ */
function makeDragReorderable(container, rowSelector, getId, onReordered){
  const rows = () => Array.from(container.querySelectorAll(rowSelector));

  rows().forEach(row=>{
    const handle = row.querySelector('.drag-handle');
    if(!handle) return;
    handle.setAttribute('tabindex','0');
    handle.setAttribute('role','button');
    handle.setAttribute('aria-label','Drag to reorder. Use arrow keys when focused.');

    const onMove = (e)=>{
      // Find the first sibling (in current DOM order) whose midpoint is
      // below the pointer, and drop the row right before it — a single-pass
      // scan that lands on the correct slot in one step even for a large,
      // fast pointer jump (a step-by-step "swap with the first sibling
      // that matches" approach can get stuck one slot early on fast drags).
      const siblings = rows().filter(r=>r!==row);
      let insertBefore = null;
      for(const sib of siblings){
        const rect = sib.getBoundingClientRect();
        const mid = rect.top + rect.height/2;
        if(e.clientY < mid){ insertBefore = sib; break; }
      }
      if(insertBefore) container.insertBefore(row, insertBefore);
      else container.appendChild(row);
    };

    const onUp = ()=>{
      row.classList.remove('dragging');
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      onReordered(rows().map(getId));
    };

    handle.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      row.classList.add('dragging');
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });

    handle.addEventListener('keydown', (e)=>{
      if(e.key!=='ArrowUp' && e.key!=='ArrowDown') return;
      e.preventDefault();
      const list = rows();
      const idx = list.indexOf(row);
      const targetIdx = e.key==='ArrowUp' ? idx-1 : idx+1;
      if(targetIdx<0 || targetIdx>=list.length) return;
      if(e.key==='ArrowUp') container.insertBefore(row, list[targetIdx]);
      else container.insertBefore(row, list[targetIdx].nextSibling);
      onReordered(rows().map(getId));
      handle.focus();
    });
  });
}

  const linkedCredits = DATA.credits.filter(c=>c.cardId===id).length;

  const parts = [];
  if(linkedCredits) parts.push(`${linkedCredits} credit${linkedCredits===1?'':'s'}`);
  if(linkedFn) parts.push(`${linkedFn} free night certificate${linkedFn===1?'':'s'}`);
  if(linkedHist) parts.push(`${linkedHist} redemption log entr${linkedHist===1?'y':'ies'}`);
  const detail = parts.length

    : '';
  showConfirm(`Delete "${escHtml(card?card.name:'this card')}"?${detail}`, ()=>{
    DATA.cards = DATA.cards.filter(c=>c.id!==id);

/* ---------- Annual Credits ---------- */
function sortedCreditsList(today){
  const withCycle = DATA.credits.map(cr=>{
    // FIX: use the selected year's cycle, not always "today"'s — see
    // cycleForSelectedYear(). Each row still rolls forward a full year to
    // reach its own next occurrence (see the comment on currentCycle) —
    // that's what keeps distinct rows like Q1-Q4 or H1/H2 from drifting
    // into each other's windows.
    const {cycle, isLive} = cycleForSelectedYear(cr.anchor, CYCLE_MONTHS[cr.frequency]||12, today);
    return {cr, cycle, isLive};
  });
  if(creditsSortMode === 'value'){
    withCycle.sort((a,b)=> b.cr.value - a.cr.value);
  } else if(creditsSortMode === 'daysLeft'){
    withCycle.sort((a,b)=>{
      const da = a.cycle ? daysBetween(today, a.cycle.end) : 9999;
      const db = b.cycle ? daysBetween(today, b.cycle.end) : 9999;
      return da - db;
    });
  }
  // 'manual' mode: keep DATA.credits array order as-is
  return withCycle;
}

// Builds one credit row's HTML. Split out from renderCredits() so the exact
// same row markup can be used whether the list is flat or grouped by card —
// grouping only changes how rows are arranged/labeled, never what a row
// itself looks like or does.
function renderCreditRowHtml(today, {cr, cycle, isLive}, showDragHandle){
  const card = cardById(cr.cardId);
  // Any logged entry counts as redeemed for the period — logging a
  // second one for the same window is blocked (see openRedeemModal),
  // so the row shouldn't offer "Mark redeemed" again just because the
  // logged amount happens to be under the credit's face value.
  const isRedeemed = cycle ? historyEntriesInCycle(cr.id, cycle).length > 0 : false;
  const hasAnyHistory = !cycle && DATA.history.some(h=>h.sourceId===cr.id);
  const daysLeft = (cycle && isLive) ? daysBetween(today, cycle.end) : null;
  const isExpired = daysLeft !== null && daysLeft < 0 && !isRedeemed;
  let pill;
  if(!cycle && hasAnyHistory){ pill = {label:'Logged', cls:'pill-green'}; }
  else if(!cycle){ pill = {label:'No anchor date', cls:'pill-gray'}; }
  else if(isRedeemed){ pill = {label:'Redeemed', cls:'pill-green'}; }
  else if(isExpired){ pill = {label:'Expired', cls:'pill-gray'}; }
  else if(isLive){ pill = statusForDays(daysBetween(today, cycle.end), 60); }
  else { pill = {label:'Not redeemed', cls:'pill-gray'}; }
  let progressPct = null;
  if(cycle && isLive){
    const total = cycle.nextStart - cycle.start;
    const elapsed = today - cycle.start;
    progressPct = Math.max(0, Math.min(100, Math.round((elapsed/total)*100)));
  }

  return `
  <div class="list-row" data-row-id="${cr.id}">
    ${showDragHandle ? '<div class="drag-handle">⠿</div>' : '<div style="width:20px;"></div>'}
    <div class="main-col">
      <div class="title"${isExpired ? ' style="text-decoration:line-through;opacity:.55;"' : ''}>${escHtml(cr.name)}</div>
      <div class="subtitle">${card?escHtml(card.name):'(unlinked)'} · ${escHtml(cr.frequency)} · ${cycle ? (isLive ? `resets ${fmtDate(cycle.end)}` : `${fmtDate(cycle.start)} – ${fmtDate(cycle.end)}`) : 'no anchor date set'}${cr.autoRedeem?' · Auto-credited, no action needed':''}</div>
      ${progressPct!==null ? `<div style="height:4px;background:var(--gray-bg);border-radius:2px;margin-top:6px;overflow:hidden;"><div style="height:100%;width:${progressPct}%;background:${isRedeemed?'var(--green)':'var(--navy-light)'};"></div></div>` : ''}
    </div>
    <div class="row-break"></div>
    <div class="amount">$${cr.value}</div>
    <div><span class="pill ${pill.cls}">${pill.label}</span></div>
    <div class="days">${daysLeft!==null? (daysLeft>=0? daysLeft+' days left' : '') : ''}</div>
    <div class="row-break"></div>
    <div class="actions">
      ${!isRedeemed && cycle && !cr.autoRedeem ? `<button class="btn btn-sm btn-primary" data-mark-cr="${cr.id}">Mark redeemed</button>` : ''}
      ${!cycle ? `<button class="btn btn-sm btn-primary" data-mark-cr="${cr.id}">+ Log redemption</button>` : ''}
      ${isRedeemed ? `<button class="btn btn-sm" data-editredemption-cr="${cr.id}">Edit amount</button><button class="btn btn-sm btn-danger" data-unredeem-cr="${cr.id}">Unredeem</button>` : ''}
      <button class="btn btn-sm" data-edit-cr="${cr.id}">Edit</button>
      <button class="btn btn-sm btn-danger" data-del-cr="${cr.id}">Delete</button>
    </div>
  </div>`;
}

function renderCredits(){
  const today = new Date();
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>${DATA.credits.length} recurring credits</h2>
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
          <label style="font-size:12.5px;display:flex;align-items:center;gap:5px;white-space:nowrap;">
            <input type="checkbox" id="creditsGroupToggle" ${creditsGroupByCard?'checked':''}> Group by card
          </label>
          <select id="creditsSortSelect" class="btn-sm">
            <option value="daysLeft">Sort: days left</option>
            <option value="value">Sort: value</option>
            <option value="manual">Sort: manual order</option>
          </select>
          <button class="btn btn-primary" id="addCreditBtn">+ Add credit</button>
        </div>
      </div>
      <div class="panel-body" id="creditList"></div>
    </div>
  `;
  document.getElementById('creditsSortSelect').value = creditsSortMode;
  const list = document.getElementById('creditList');
  if(DATA.credits.length===0){ list.innerHTML = '<div class="empty">No credits yet.</div>'; }

  const ordered = sortedCreditsList(today);

  let rowsHtml;
  if(creditsGroupByCard){
    // ENHANCEMENT: group by card. This only changes how existing rows are
    // arranged/labeled on screen — it doesn't reorder, mutate, or otherwise
    // touch DATA.credits at all, so turning the toggle back off always
    // restores exactly the same flat list (in whatever sort mode was
    // already selected) with nothing lost or changed underneath.
    const UNLINKED = '__unlinked__';
    const groups = new Map();
    ordered.forEach(item=>{
      const key = (item.cr.cardId && cardById(item.cr.cardId)) ? item.cr.cardId : UNLINKED;
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push(item);
    });
    const groupKeyOrder = DATA.cards.map(c=>c.id).filter(id=>groups.has(id));
    if(groups.has(UNLINKED)) groupKeyOrder.push(UNLINKED);
    rowsHtml = groupKeyOrder.map(key=>{
      const items = groups.get(key);
      const label = key===UNLINKED ? '(unlinked)' : escHtml(cardById(key).name);
      const groupTotal = items.reduce((s,i)=>s+i.cr.value,0);
      const header = `<div style="padding:10px 20px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);background:var(--surface-hover);border-bottom:1px solid var(--border);">${label} · ${items.length} credit${items.length===1?'':'s'} · $${groupTotal.toLocaleString()}</div>`;
      return header + items.map(item=>renderCreditRowHtml(today, item, false)).join('');
    }).join('');
  } else {
    rowsHtml = ordered.map(item=>renderCreditRowHtml(today, item, true)).join('');
  }
  list.innerHTML = rowsHtml || '<div class="empty">No credits yet.</div>';

  document.getElementById('addCreditBtn').onclick = ()=>openCreditModal();
  document.getElementById('creditsSortSelect').onchange = (e)=>{ creditsSortMode = e.target.value; renderCredits(); };
  document.getElementById('creditsGroupToggle').onchange = (e)=>{ creditsGroupByCard = e.target.checked; renderCredits(); };
  list.querySelectorAll('[data-edit-cr]').forEach(b=>b.onclick=()=>openCreditModal(b.dataset.editCr));
  list.querySelectorAll('[data-del-cr]').forEach(b=>b.onclick=()=>{
    showConfirm('Delete this credit? Its logged redemption history will remain in the log but become unlinked.', ()=>{
      DATA.credits=DATA.credits.filter(x=>x.id!==b.dataset.delCr); saveData(); renderCredits();
    });
  });
  list.querySelectorAll('[data-mark-cr]').forEach(b=>{
    const id = b.dataset.markCr;
    const row = ordered.find(o=>o.cr.id===id);
    b.onclick = ()=>openRedeemModal('cr', id, row.cycle);
  });
  list.querySelectorAll('[data-editredemption-cr]').forEach(b=>{
    const id = b.dataset.editredemptionCr;
    const row = ordered.find(o=>o.cr.id===id);
    b.onclick = ()=>{
      const entries = historyEntriesInCycle(id, row.cycle);
      if(entries.length === 1) openEditLinkedAmountModal(entries[0].id);
      else { toast('Multiple redemptions logged for this period — edit them from the Redemption Log tab.'); switchView('history'); }
    };
  });
  list.querySelectorAll('[data-unredeem-cr]').forEach(b=>{
    const id = b.dataset.unredeemCr;
    const row = ordered.find(o=>o.cr.id===id);
    b.onclick = ()=>unredeemItem('cr', id, row.cycle);
  });

  // ENHANCEMENT: dragging to manually reorder doesn't make sense across
  // group boundaries, so it's simply not offered while grouped — the
  // "Sort: manual order" option and drag handles come back exactly as
  // before the moment "Group by card" is unchecked.
  if(!creditsGroupByCard){
    makeDragReorderable(list, '.list-row', row=>row.dataset.rowId, (newOrderIds)=>{
      const wasManual = creditsSortMode === 'manual';
      DATA.credits = newOrderIds.map(id=>DATA.credits.find(c=>c.id===id));
      creditsSortMode = 'manual';
      saveData();
      if(!wasManual){ toast('Switched to manual order'); renderCredits(); }
      else { document.getElementById('creditsSortSelect').value = 'manual'; }
    });
  }
}

function openRedeemModal(kind, sourceId, cycle){
  const item = kind==='cr' ? DATA.credits.find(x=>x.id===sourceId) : DATA.freeNights.find(x=>x.id===sourceId);

  // FIX: `cycle` is now passed in by the caller (the row already computed
  // it via cycleForSelectedYear, so it matches whatever year is currently
  // selected) instead of being recomputed here relative to today. Recomputing
  // here unconditionally used to ignore the year selector entirely — you
  // could be viewing 2024 and clicking "Mark redeemed" would still log
  // against today's real live cycle.
  //
  // Hard guard against logging the same item twice in the same cycle. The
  // "Mark redeemed"/"Mark used" button is already hidden once something's
  // logged, but that's just UI — this check is the real gate, so a stale
  // render, a double-click before re-render, or any other path into this
  // function can't create a second entry for the same window.
  if(cycle && historyEntriesInCycle(sourceId, cycle).length > 0){
    toast('Already logged for this period — edit the amount or unredeem it first.');
    return;
  }

  const defaultAmount = kind==='cr' ? item.value : (item.cashValue||'');
  // A credit always has a known face value (its "value" field), so it can
  // always default the Amount field. A free night doesn't — its cash value
  // depends on which hotel you actually book — so a brand-new certificate
  // with nothing logged yet opens with the Amount field blank. Left
  // unvalidated, an accidental blank save silently logged a $0 redemption,
  // and because "used" status only counts redeemed > 0, that $0 entry then
  // didn't even register as Redeemed — clicking "Mark used" looked like it
  // had silently done nothing. Requiring a real value up front fixes both.
  const needsValue = kind==='fn' && !defaultAmount;
  showModal(`
    <div class="modal-head"><h3>Log redemption</h3><button class="close-x" id="modalClose">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Date used</label><input id="f_date" type="date" value="${defaultRedeemDate(cycle)}"></div>
      <div class="field"><label>Amount ($)</label><input id="f_amount" type="number" min="0" value="${defaultAmount}" placeholder="${needsValue?'Estimated cash value of the stay you booked':''}"></div>
      ${needsValue ? `<div class="hint">Free nights don't have a fixed dollar value — enter what the stay would have cost in cash (check the hotel's rate for your dates) so it counts toward value realized.</div>` : ''}
      ${kind==='fn' ? `<div class="field"><label>Property (optional)</label><input id="f_property" value="${escAttr(item.property||'')}"></div>` : ''}
    </div>
    <div class="modal-foot">
      <button class="btn" id="modalCancel">Cancel</button>
      <button class="btn btn-primary" id="modalSave">Save</button>
    </div>
  `);
  document.getElementById('modalSave').onclick = ()=>{
    // Re-check at save time too — the modal can sit open for a while (or a
    // sync from another device could land) before Save is actually clicked.
    if(historyEntriesInCycle(sourceId, cycle).length > 0){
      toast('Already logged for this period — edit the amount or unredeem it first.');
      closeModal();
      if(kind==='cr') renderCredits(); else renderFreeNights();
      return;
    }
    const amount = Number(val('f_amount'))||0;
    if(amount < 0){ toast('Amount cannot be negative'); return; }
    if(kind==='fn' && amount <= 0){
      toast('Enter the cash value of this free night before marking it used');
      return;
    }
    const entry = {
      id: uid('rh'), date: val('f_date'), cardId: item.cardId, type: kind==='cr'?'Credit':'Free Night',
      sourceId: item.id, desc: kind==='cr'?item.name:item.desc, amount
    };
    DATA.history.push(entry);
    if(kind==='fn'){
      item.cashValue = entry.amount;
      const propEl = document.getElementById('f_property');
      if(propEl) item.property = propEl.value;
    }
    saveData(); closeModal();
    if(kind==='cr') renderCredits(); else renderFreeNights();
    toast('Redemption logged');
  };
}

/* ---------- Free Nights ---------- */
function sortedFreeNightsList(today){
  const withCycle = DATA.freeNights.map(fn=>{
    // FIX: use the selected year's cycle, not always "today"'s.
    const {cycle, isLive} = cycleForSelectedYear(fn.anchor, 12, today);
    return {fn, cycle, isLive};
  });
  if(fnSortMode === 'value'){
    withCycle.sort((a,b)=> (b.fn.cashValue||0) - (a.fn.cashValue||0));
  } else if(fnSortMode === 'daysLeft'){
    withCycle.sort((a,b)=>{
      const ea = effectiveExpiration(a.fn, a.cycle);
      const eb = effectiveExpiration(b.fn, b.cycle);
      const da = ea ? daysBetween(today, ea) : 9999;
      const db = eb ? daysBetween(today, eb) : 9999;
      return da - db;
    });
  }
  // 'manual' mode: keep DATA.freeNights array order as-is
  return withCycle;
}

// Same split-out pattern as renderCreditRowHtml — see its comment above.
function renderFreeNightRowHtml(today, {fn, cycle, isLive}, showDragHandle){
  const card = cardById(fn.cardId);
  const redeemed = redeemedInCycle(fn.id, cycle);
  const isUsed = redeemed > 0;
  const expiration = effectiveExpiration(fn, cycle);
  const hasAnyHistory = !cycle && DATA.history.some(h=>h.sourceId===fn.id);
  const daysLeft = (expiration && isLive) ? daysBetween(today, expiration) : null;
  const isExpired = daysLeft !== null && daysLeft < 0 && !isUsed;
  let pill;
  if(!cycle && hasAnyHistory){ pill = {label:'Logged', cls:'pill-green'}; }
  else if(!cycle){ pill = {label:'Not yet issued', cls:'pill-gray'}; }
  else if(isUsed){ pill = {label:'Redeemed', cls:'pill-green'}; }
  else if(isExpired){ pill = {label:'Expired', cls:'pill-gray'}; }
  else if(isLive){ pill = statusForDays(daysBetween(today, expiration), 90); }
  else { pill = {label:'Not redeemed', cls:'pill-gray'}; }
  let progressPct = null;
  if(cycle && isLive){
    const total = cycle.nextStart - cycle.start;
    const elapsed = today - cycle.start;
    progressPct = Math.max(0, Math.min(100, Math.round((elapsed/total)*100)));
  }

  return `
  <div class="list-row" data-row-id="${fn.id}">
    ${showDragHandle ? '<div class="drag-handle">⠿</div>' : '<div style="width:20px;"></div>'}
    <div class="main-col">
      <div class="title"${isExpired ? ' style="text-decoration:line-through;opacity:.55;"' : ''}>${escHtml(fn.desc)}</div>
      <div class="subtitle">${card?escHtml(card.name):'(unlinked)'} · ${escHtml(fn.program)}${expiration?` · expires ${fmtDate(expiration)}${fn.expirationOverride?' (set manually)':''}`:(cycle?'':' · no anchor date set')}</div>
      ${progressPct!==null ? `<div style="height:4px;background:var(--gray-bg);border-radius:2px;margin-top:6px;overflow:hidden;"><div style="height:100%;width:${progressPct}%;background:${isUsed?'var(--green)':'var(--navy-light)'};"></div></div>` : ''}
    </div>
    <div class="row-break"></div>
    <div class="amount">${redeemed>0?'$'+redeemed:'—'}</div>
    <div><span class="pill ${pill.cls}">${pill.label}</span></div>
    <div class="days">${daysLeft!==null? (daysLeft>=0? daysLeft+' days left' : '') : ''}</div>
    <div class="row-break"></div>
    <div class="actions">
      ${!isUsed && cycle ? `<button class="btn btn-sm btn-primary" data-mark-fn="${fn.id}">Mark used</button>` : ''}
      ${!cycle ? `<button class="btn btn-sm btn-primary" data-mark-fn="${fn.id}">+ Log redemption</button>` : ''}
      ${isUsed ? `<button class="btn btn-sm" data-editredemption-fn="${fn.id}">Edit amount</button><button class="btn btn-sm btn-danger" data-unredeem-fn="${fn.id}">Unredeem</button>` : ''}
      <button class="btn btn-sm" data-edit-fn="${fn.id}">Edit</button>
      <button class="btn btn-sm btn-danger" data-del-fn="${fn.id}">Delete</button>
    </div>
  </div>`;
}

      <div class="hint">Leave blank if this card's first certificate hasn't been issued yet.</div>
      <div class="field"><label>Expiration date override (optional)</label><input id="f_expiration" type="date" value="${fn.expirationOverride||''}"></div>
      <div class="hint">By default the expiration shown is calculated as 12 months from the anchor date. A certificate's real expiration doesn't always match that exactly — issuers sometimes run a few days behind, or grant a one-time extension — so once you see the actual date in your hotel account, enter it here and it'll be used instead. Leave blank to keep using the calculated date.</div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="modalCancel">Cancel</button>
      <button class="btn btn-primary" id="modalSave">Save</button>
    </div>
  `);
  document.getElementById('modalSave').onclick = ()=>{
    const obj = { id: editing?id:uid('fn'), cardId: val('f_card'), program: val('f_program'), desc: val('f_desc'), anchor: val('f_anchor')||null, cashValue: fn.cashValue||null, expirationOverride: val('f_expiration')||null };
    if(!obj.desc){ toast('Description is required'); return; }
    if(editing){ const i=DATA.freeNights.findIndex(x=>x.id===id); DATA.freeNights[i]=obj; } else DATA.freeNights.push(obj);
    saveData(); closeModal(); renderFreeNights(); toast('Certificate saved');
  };
}

/* ---------- Redemption History ---------- */
function renderHistory(){
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>${DATA.history.length} entries</h2>
        <div style="display:flex;gap:8px;align-items:center;">
          <select id="histSortSelect" class="btn-sm">
            <option value="date">Sort: date</option>
            <option value="manual">Sort: manual order</option>
          </select>
          <button class="btn btn-primary" id="addHistBtn">+ Log redemption</button>
        </div>
      </div>
      <div class="panel-body">
        <div class="table-scroll">
        <table>
          <thead><tr><th></th><th>Date</th><th>Card</th><th>Type</th><th>Credit / Certificate</th><th>Amount</th><th></th></tr></thead>
          <tbody id="histBody"></tbody>
        </table>
        </div>
      </div>
    </div>
  `;
  document.getElementById('histSortSelect').value = historySortMode;
  const body = document.getElementById('histBody');
  const rows = historySortMode === 'manual'
    ? DATA.history.slice()
    : DATA.history.slice().sort((a,b)=>parseDate(b.date)-parseDate(a.date));

  body.innerHTML = rows.length ? rows.map(h=>{
    const card = cardById(h.cardId);
    return `<tr data-row-id="${h.id}">
      <td><div class="drag-handle">⠿</div></td>
      <td>${fmtDate(parseDate(h.date))}</td>
      <td>${card?escHtml(card.name):'(unlinked)'}</td>
      <td><span class="pill ${h.type==='Credit'?'pill-accent':'pill-gray'}">${escHtml(h.type)}</span></td>
      <td>${escHtml(h.desc)}</td>
      <td style="font-weight:700;">$${Number(h.amount).toLocaleString()}</td>
      <td><button class="btn btn-sm" data-edit-h="${h.id}">Edit</button> <button class="btn btn-sm btn-danger" data-del-h="${h.id}">Delete</button></td>
    </tr>`;
  }).join('') : `<tr><td colspan="7" class="empty">No redemptions logged yet.</td></tr>`;

  document.getElementById('addHistBtn').onclick = ()=>openHistModal();
  document.getElementById('histSortSelect').onchange = (e)=>{ historySortMode = e.target.value; renderHistory(); };
  body.querySelectorAll('[data-edit-h]').forEach(b=>b.onclick=()=>openHistModal(b.dataset.editH));
  body.querySelectorAll('[data-del-h]').forEach(b=>b.onclick=()=>{
    showConfirm('Delete this redemption entry? This cannot be undone.', ()=>{
      DATA.history=DATA.history.filter(x=>x.id!==b.dataset.delH); saveData(); renderHistory();
    });
  });

  if(rows.length){
    makeDragReorderable(body, 'tr[data-row-id]', row=>row.dataset.rowId, (newOrderIds)=>{
      const wasManual = historySortMode === 'manual';
      DATA.history = newOrderIds.map(id=>DATA.history.find(h=>h.id===id));
      historySortMode = 'manual';
      saveData();
      if(!wasManual){ toast('Switched to manual order'); renderHistory(); }
      else { document.getElementById('histSortSelect').value = 'manual'; }
    });
  }
}

function openHistModal(id){
  const editing = !!id;
  const entry = editing ? DATA.history.find(h=>h.id===id) : null;
  showModal(`
    <div class="modal-head"><h3>${editing?'Edit redemption':'Log redemption'}</h3><button class="close-x" id="modalClose">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Date used</label><input id="f_date" type="date" value="${entry?entry.date:new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>Card</label><select id="f_card">${DATA.cards.map(c=>`<option value="${c.id}" ${entry&&c.id===entry.cardId?'selected':''}>${escHtml(c.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Type</label><select id="f_type"><option ${entry&&entry.type==='Credit'?'selected':''}>Credit</option><option ${entry&&entry.type==='Free Night'?'selected':''}>Free Night</option></select></div>
      <div class="field"><label>Description</label><input id="f_desc" value="${escAttr(entry?entry.desc:'')}" placeholder="e.g. $300 Annual Travel Credit"></div>
      <div class="field"><label>Amount ($)</label><input id="f_amount" type="number" min="0" value="${entry?entry.amount:''}"></div>
      ${entry&&entry.sourceId ? `<div class="hint">This entry is linked to a row on the Annual Credits or Free Nights tab. Editing it here updates that row's status too.</div>` : ''}
    </div>
    <div class="modal-foot">
      <button class="btn" id="modalCancel">Cancel</button>
      <button class="btn btn-primary" id="modalSave">Save</button>
    </div>
  `);
  document.getElementById('modalSave').onclick = ()=>{
    const desc = val('f_desc');
    const amount = Number(val('f_amount'))||0;
    if(!desc){ toast('Description is required'); return; }
    if(amount < 0){ toast('Amount cannot be negative'); return; }
    if(editing){
      Object.assign(entry, { date: val('f_date'), cardId: val('f_card'), type: val('f_type'), desc, amount });
    } else {
      DATA.history.push({ id:uid('rh'), date: val('f_date'), cardId: val('f_card'), type: val('f_type'), sourceId:null, desc, amount });
    }
    saveData(); closeModal(); renderHistory(); toast(editing?'Redemption updated':'Redemption logged');
  };
}

/* ============================================================
   MODAL / TOAST HELPERS
   ============================================================ */
function showModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('modalCancel').onclick = closeModal;
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });

// FIX: replaces native confirm() throughout the app. confirm()/prompt()
// dialogs can be silently blocked or auto-dismissed inside in-app browsers
// (Slack, Instagram, some mobile chat webviews) — a tap on "Delete" could
// do nothing with no visible error. Routes every destructive confirmation
// through the app's own modal instead, which behaves identically everywhere
// this page can be opened.
function showConfirm(message, onYes, opts={}){
  const danger = opts.danger !== false;
  const confirmLabel = opts.confirmLabel || 'Delete';
  showModal(`
    <div class="modal-head"><h3>${opts.title||'Are you sure?'}</h3><button class="close-x" id="modalClose">✕</button></div>
    <div class="modal-body"><div style="font-size:13.5px;line-height:1.5;">${message}</div></div>
    <div class="modal-foot">
      <button class="btn" id="modalCancel">Cancel</button>
      <button class="btn ${danger?'btn-danger':'btn-primary'}" id="modalConfirmYes">${confirmLabel}</button>
    </div>
  `);
  document.getElementById('modalConfirmYes').onclick = ()=>{ closeModal(); onYes(); };
}

function val(id){ return document.getElementById(id).value; }
// FIX: escapes &, <, >, and quote characters so user-entered text (card
// names, notes, descriptions, etc.) can't break out of an HTML attribute or
// be interpreted as markup when rendered back into the page. The previous
// version only escaped double quotes, which was enough to stop broken
// attributes but not enough to stop injected tags/scripts if this data ever
// came from a source that wasn't fully trusted (e.g. the shared Supabase
// table, if its write access isn't locked down — see the security note).
function escHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function escAttr(s){ return escHtml(s); }

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============================================================
   EXPORT / IMPORT
   ============================================================ */
document.getElementById('exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `hotel-card-tracker-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
};
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.cards || !parsed.credits) throw new Error('bad format');
      DATA = migrateData(parsed); saveData(); runAutoRedemptions(); renderYearSelect(); switchView(currentView);
      toast('Data imported');
    }catch(err){ toast('Could not read that file — is it a tracker backup JSON?'); }
  };
  reader.readAsText(file);
  e.target.value = '';
};

/* ============================================================
   INIT
   ============================================================ */
document.querySelectorAll('#nav button').forEach(b=> b.onclick = ()=> switchView(b.dataset.view));
document.getElementById('yearSelect').onchange = (e)=>{ selectedYear = Number(e.target.value); switchView(currentView); };
document.getElementById('addYearBtn').onclick = addTrackedYear;
document.getElementById('deleteYearBtn').onclick = deleteTrackedYear;

// ENHANCEMENT: dark mode toggle — flips the html[data-theme] attribute the
// CSS variables key off of, and remembers the choice locally (per-device,
// not synced — same rationale as above).
function updateThemeButtonIcon(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.getElementById('themeToggleBtn').textContent = isDark ? '☀️' : '🌙';
}
updateThemeButtonIcon();
document.getElementById('themeToggleBtn').onclick = ()=>{
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const next = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  updateThemeButtonIcon();
  // Only repaint if Dashboard is actually the view on screen right now —
  // calling renderDashboard() unconditionally would silently swap #content
  // to the Dashboard's markup while the sidebar nav still shows whichever
  // tab was actually active, leaving the two out of sync.
  if(currentView === 'dashboard') renderDashboard();
};

let hasRenderedOnce = false;

runAutoRedemptions();
renderYearSelect();
switchView('dashboard');
hasRenderedOnce = true;

// Reconcile with the cloud right after first paint (non-blocking — the app
// is already usable from local data by the time this resolves).
bootstrapSync();

// Whenever this tab/window becomes active again (switching back from
// another app, waking the laptop, reopening on the phone), either flush any
// change that failed to sync while inactive, or pull in anything saved from
// another device meanwhile. Also re-check for any auto-redeemed benefits
// whose date may have arrived while the tab was in the background.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState !== 'visible') return;
  if(localStorage.getItem(DIRTY_KEY) === '1' || syncPending) pushToCloud();
  else bootstrapSync();
  if(runAutoRedemptions()) switchView(currentView);
});
</script>
</body>
</html>
